<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Prime Protocol · Klanten</title>

<!-- Dynamic Inline Web Manifest -->
<script id="pwa-manifest" type="application/json">
{
  "name": "Prime Protocol",
  "short_name": "Prime Protocol",
  "start_url": "./",
  "scope": "./",
  "display": "standalone",
  "background_color": "#070b12",
  "theme_color": "#070b12",
  "lang": "nl",
  "icons": [
    {"src":"icon-192.png","sizes":"192x192","type":"image/png","purpose":"any maskable"},
    {"src":"icon-512.png","sizes":"512x512","type":"image/png","purpose":"any maskable"}
  ]
}
</script>
<script>
  (function() {
    const manifestEl = document.getElementById('pwa-manifest');
    if (manifestEl) {
      const blob = new Blob([manifestEl.textContent], {type: 'application/json'});
      const manifestUrl = URL.createObjectURL(blob);
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = manifestUrl;
      document.head.appendChild(link);
    }
  })();
</script>

<style>
:root {
  --bg: #070b12;
  --panel: #101a2a;
  --line: #154b66;
  --cyan: #18d7ff;
  --purple: #7567ff;
  --text: #f5f8ff;
  --muted: #8492a6;
  --green: #00d79d;
  --amber: #ffb21c;
  --red: #ff5364;
  --shadow: 0 8px 24px rgba(0,0,0,.35);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100dvh;
  background: radial-gradient(circle at 92% -5%, #102b45 0, transparent 34%), var(--bg);
  color: var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
  padding-bottom: 80px;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; outline: none; }

.app {
  width: min(100%, 600px);
  margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 14px) 14px 20px;
}

/* Header */
.top {
  border: 1px solid #15506a;
  background: linear-gradient(145deg, #111b2d, #0c1422);
  border-radius: 16px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  box-shadow: var(--shadow);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { font-size: 24px; }
.brand h1 {
  font-size: 17px; line-height: 1.1; letter-spacing: 1.5px;
  margin: 0; color: #2dd5fa; font-weight: 800;
}
.brand small {
  display: block; color: #7f8da2; margin-top: 4px;
  letter-spacing: .8px; font-size: 9px; font-weight: 700;
}

/* Buttons */
.btn {
  border: 1px solid #1c5a75; background: #0d1b2b; color: #fff;
  border-radius: 10px; padding: 10px 14px; font-weight: 700;
  font-size: 13px; display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; min-height: 42px; transition: all .15s ease;
}
.btn:active { transform: scale(0.97); }
.btn.primary { background: linear-gradient(105deg, #09cbed, #7868ff); border: 0; box-shadow: 0 4px 14px rgba(9,203,237,.3); }
.btn.danger { border-color: #71303a; color: #ff7580; background: rgba(113,48,58,.2); }
.btn.ok { border-color: #08795e; color: #00e3a4; background: rgba(8,121,94,.2); }
.btn.sm { padding: 6px 10px; min-height: 32px; font-size: 11px; border-radius: 8px; }

/* Stats grid */
.summary {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px; margin-top: 12px;
}
.stat {
  background: linear-gradient(145deg, #101a2b, #0c1421);
  border: 1px solid #15465c; border-radius: 13px; padding: 12px 14px;
}
.stat label {
  display: block; color: #8391a6; font-size: 10px;
  font-weight: 850; letter-spacing: 1px;
}
.stat b { display: block; font-size: 26px; margin-top: 4px; color: var(--cyan); font-weight: 800; }

/* Main Card */
.card {
  margin-top: 12px;
  background: linear-gradient(145deg, #0f192a, #0b1422);
  border: 1px solid #15465c; border-radius: 16px;
  padding: 14px; box-shadow: var(--shadow);
}
.section-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-bottom: 12px;
}
.section-head h2 { margin: 0; color: #25d9fa; font-size: 15px; letter-spacing: 1.2px; font-weight: 800; }

/* Search & Filters */
.search { margin-bottom: 10px; }
.search input {
  width: 100%; background: #0a111c; color: #f4f7fb;
  border: 1px solid #234155; border-radius: 10px;
  padding: 12px 14px; font-size: 15px; outline: none;
  transition: border-color .2s ease;
}
.search input:focus, .field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--cyan);
}

.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; }
.chip {
  background: #0a111c; border: 1px solid #1e394b; color: #8a98aa;
  padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 700;
  white-space: nowrap; cursor: pointer;
}
.chip.active { background: rgba(24, 215, 255, 0.15); border-color: var(--cyan); color: var(--cyan); }

.notice { color: #8e9bae; font-size: 12px; line-height: 1.4; margin: 6px 0 12px; }
.empty {
  padding: 28px 14px; text-align: center; color: #7f8ca0;
  border: 1px dashed #263544; border-radius: 12px; font-size: 13px;
}

/* Customer Card */
.customer-card {
  padding: 14px; border: 1px solid #1d4055; border-radius: 13px;
  background: #0a111b; margin-top: 10px; overflow-wrap: anywhere;
  transition: border-color .2s ease;
}
.customer-card.due { border-color: var(--red); background: linear-gradient(120deg, #240c13, #0a111b); }
.customer-card.soon { border-color: #9a6a12; }
.customer-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.customer-name { font-size: 17px; font-weight: 800; color: #fff; }
.customer-info { color: #8e9bae; font-size: 12px; line-height: 1.55; margin-top: 6px; }

.badge {
  display: inline-block; border: 1px solid #1d826c; color: #00dba0;
  border-radius: 999px; padding: 4px 8px; font-size: 10px;
  font-weight: 850; white-space: nowrap; background: rgba(0,219,160,.1);
}
.badge.due { border-color: var(--red); color: #ff7884; background: rgba(255,83,100,.15); }
.badge.soon { border-color: #a86e00; color: #ffbd2e; background: rgba(255,178,28,.1); }

.quick-actions { display: flex; gap: 8px; margin-top: 10px; }
.action-link {
  display: inline-flex; align-items: center; gap: 4px;
  color: #84a6c0; font-size: 11px; text-decoration: none;
  background: #0e1a29; border: 1px solid #1b3a50; border-radius: 6px;
  padding: 4px 8px; font-weight: 600;
}

.row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }

/* Navigation bar */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(13, 22, 36, 0.95); backdrop-filter: blur(12px);
  border-top: 1px solid #1b4b63; display: flex; justify-content: space-around;
  padding: 8px 0 calc(6px + env(safe-area-inset-bottom)); z-index: 20;
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: #687993; font-size: 10px; font-weight: 700; text-decoration: none;
  background: transparent; border: 0; padding: 6px 12px; width: 33%;
}
.nav-item.active { color: var(--cyan); }
.nav-icon { font-size: 18px; }

/* Modal & Form Grid Fixes */
.modal {
  position: fixed; inset: 0; background: rgba(3, 7, 13, 0.82);
  backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center;
  padding: 12px; z-index: 50; overflow-y: auto;
}
.modal.show { display: flex; }
.modalbox {
  width: min(560px, 100%); max-height: 90dvh; overflow-y: auto;
  background: #0d1624; border: 1px solid #1b536b;
  border-radius: 18px; padding: 18px; margin: auto; box-shadow: 0 12px 32px rgba(0,0,0,.6);
}
.modalbox h2 { margin: 0 0 16px; font-size: 18px; color: #fff; font-weight: 800; }

/* GEWOON 1 KOLOM VOOR FORMULIEREN OP MOBIEL -> DIT LOST DE OVERLAPPING OP! */
.formgrid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
  min-width: 0;
}

/* Desktop layout past 2 kolommen toe op grotere schermen */
@media (min-width: 500px) {
  .formgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

.field { min-width: 0; width: 100%; }
.field.full { grid-column: 1 / -1; }
.field label {
  display: block; color: #8a98aa; font-size: 10px;
  font-weight: 850; margin-bottom: 6px; letter-spacing: .5px; text-transform: uppercase;
}
.field input, .field select, .field textarea {
  width: 100%; min-width: 0; display: block;
  background: #0a111c; color: #f4f7fb;
  border: 1px solid #234155; border-radius: 10px;
  padding: 12px; outline: none; font-size: 15px;
  -webkit-appearance: none; appearance: none;
}
.field select {
  background-image: url("data:image/svg+xml;utf8,<svg fill='%238a98aa' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='7 10l5 5 5-5z'/></svg>");
  background-repeat: no-repeat; background-position: right 10px center; padding-right: 32px;
}
.field input[type="date"] {
  min-height: 46px;
  line-height: 1.2;
}
.field textarea { min-height: 85px; resize: vertical; }

/* Log items */
.log-item {
  padding: 10px 12px; border-bottom: 1px solid #172b3c; font-size: 12px;
  display: flex; justify-content: space-between; align-items: center;
}
.log-item:last-child { border-bottom: none; }
.log-date { color: #61748d; font-size: 10px; }

/* Notification Toast */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
  background: #112538; border: 1px solid var(--cyan); color: #fff;
  padding: 10px 18px; border-radius: 20px; font-size: 12px; font-weight: 700;
  box-shadow: 0 8px 20px rgba(0,0,0,.5); opacity: 0; transition: all .3s ease; z-index: 100;
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>

<body>
<div id="toast" class="toast"></div>

<div class="app">

  <header class="top">
    <div class="brand">
      <span class="logo">⚡</span>
      <div>
        <h1>PRIME PROTOCOL</h1>
        <small>KLANTENBEHEER · PWA READY</small>
      </div>
    </div>
    <button class="btn primary" onclick="openCustomer()">+ Klant</button>
  </header>

  <!-- TAB 1: KLANTEN -->
  <main id="tab-customers">
    <div class="summary">
      <div class="stat">
        <label>TOTAAL KLANTEN</label>
        <b id="totalCustomers">0</b>
      </div>
      <div class="stat">
        <label>OPVOLGING NODIG</label>
        <b id="dueCustomers">0</b>
      </div>
    </div>

    <section class="card">
      <div class="section-head">
        <h2>👤 KLANTEN OVERZICHT</h2>
      </div>

      <div class="search">
        <input id="searchInput" type="search" placeholder="🔎 Zoek op naam, nummer, product..." oninput="render()">
      </div>

      <div class="filters">
        <button class="chip active" onclick="setFilter('all', this)">Alles</button>
        <button class="chip" onclick="setFilter('due', this)">⚠️ Opvolging nodig</button>
        <button class="chip" onclick="setFilter('soon', this)">⏳ Binnen 7 dagen</button>
      </div>

      <div id="customerList"></div>
    </section>
  </main>

  <!-- TAB 2: PRODUCTEN -->
  <main id="tab-products" style="display:none;">
    <section class="card">
      <div class="section-head">
        <h2>💊 PRODUCTEN & DOSERINGEN</h2>
        <button class="btn primary sm" onclick="openProductModal()">+ Product</button>
      </div>
      <div class="notice">
        Beheer hier de beschikbare varianten (bijv. Retatrutide, Tirzepatide).
      </div>
      <div id="productList"></div>
    </section>
  </main>

  <!-- TAB 3: LOGS & INSTELLINGEN -->
  <main id="tab-settings" style="display:none;">
    <section class="card">
      <div class="section-head">
        <h2>📜 OPVOLGINGSHISTORIEK</h2>
      </div>
      <div id="logList"></div>
    </section>

    <section class="card" style="margin-top:14px;">
      <div class="section-head">
        <h2>⚙️ INSTELLINGEN & BACKUP</h2>
      </div>
      <div class="notice">
        Exporteer je gegevens als JSON-bestand om een veiligheidskopie te bewaren.
      </div>
      <div class="row" style="justify-content:flex-start;">
        <button class="btn" onclick="exportCustomers()">📥 Backup Exporteren</button>
        <button class="btn" onclick="triggerImport()">📤 Backup Importeren</button>
        <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importCustomers(event)">
      </div>
    </section>
  </main>

</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-item active" onclick="switchTab('customers', this)">
    <span class="nav-icon">👤</span>
    <span>Klanten</span>
  </button>
  <button class="nav-item" onclick="switchTab('products', this)">
    <span class="nav-icon">💊</span>
    <span>Producten</span>
  </button>
  <button class="nav-item" onclick="switchTab('settings', this)">
    <span class="nav-icon">⚙️</span>
    <span>Historiek</span>
  </button>
</nav>

<!-- MODAL CONTAINER -->
<div class="modal" id="modal">
  <div class="modalbox" id="modalbox"></div>
</div>

<script>
'use strict';

const KEY = 'primeProtocolMobileV6';
let currentFilter = 'all';
let data = load();

function fresh() {
  return {
    customers: [],
    products: [
      ...['Retatrutide','Tirzepatide'].flatMap(name =>
        [10,20,30,40,50].map(mg => ({
          id: crypto.randomUUID(), name: name, strength: mg+' mg'
        }))
      )
    ],
    logs: [],
    settings: { customerInterval: 30 }
  };
}

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(KEY));
    if (!saved) return fresh();
    saved.customers = saved.customers || [];
    saved.products = saved.products || [];
    saved.logs = saved.logs || [];
    saved.settings = Object.assign({ customerInterval: 30 }, saved.settings || {});
    return saved;
  } catch(e) {
    console.error('Fout bij het laden:', e);
    return fresh();
  }
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(data));
    render();
  } catch(e) {
    showToast('Opslaan mislukt. Browseropslag vol.');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function esc(val) {
  return String(val ?? '').replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

function todayISO() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}

function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T12:00:00');
  d.setDate(d.getDate() + Number(n));
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

function dayDiff(a, b) {
  return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
}

function formatDate(dateStr) {
  if (!dateStr) return 'Niet ingesteld';
  const parts = dateStr.split('-');
  if (parts.length !== 3) return dateStr;
  return parts[2] + '-' + parts[1] + '-' + parts[0];
}

function product(id) { return data.products.find(p => p.id === id); }
function customer(id) { return data.customers.find(c => c.id === id); }

function dueLabel(dateStr) {
  if (!dateStr) return ['', 'GEPLAND'];
  const diff = dayDiff(todayISO(), dateStr);
  if (diff < 0) return ['due', 'TE LAAT (' + Math.abs(diff) + 'd)'];
  if (diff === 0) return ['due', 'VANDAAG'];
  if (diff <= 7) return ['soon', 'BINNEN ' + diff + ' DAGEN'];
  return ['', 'GEPLAND'];
}

function openModal(html) {
  document.getElementById('modalbox').innerHTML = html;
  document.getElementById('modal').classList.add('show');
}
function closeModal() { document.getElementById('modal').classList.remove('show'); }

document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});

/* Tabs Navigation */
function switchTab(tabName, btn) {
  document.querySelectorAll('main').forEach(el => el.style.display = 'none');
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + tabName).style.display = 'block';
  btn.classList.add('active');
}

function setFilter(filter, chip) {
  currentFilter = filter;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  render();
}

/* Modal formulier voor klant toevoegen/bewerken */
function openCustomer(editId = null) {
  const c = editId ? customer(editId) : null;
  const interval = c?.interval || data.settings.customerInterval || 30;

  const productOptions = data.products.map(p =>
    `<option value="${esc(p.id)}" ${c?.productId === p.id ? 'selected' : ''}>
      ${esc(p.name)}${p.strength ? ' · ' + esc(p.strength) : ''}
    </option>`
  ).join('');

  openModal(`
    <h2>${c ? '👤 Klant Aanpassen' : '👤 Nieuwe Klant'}</h2>
    <div class="formgrid">
      <div class="field">
        <label>NAAM *</label>
        <input id="cfName" value="${esc(c?.name||'')}" placeholder="Klantnaam" autocomplete="name">
      </div>

      <div class="field">
        <label>CONTACT / TELEFOONNR</label>
        <input id="cfContact" value="${esc(c?.contact||'')}" placeholder="+32 ...">
      </div>

      <div class="field">
        <label>DATUM BEZOEK</label>
        <input id="cfDate" type="date" value="${esc(c?.date||todayISO())}">
      </div>

      <div class="field">
        <label>INTERVAL (DAGEN)</label>
        <input id="cfInterval" type="number" min="1" value="${esc(interval)}">
      </div>

      <div class="field full">
        <label>PRODUCT / DOSERING</label>
        <select id="cfProduct">
          <option value="">Geen product gekoppeld</option>
          ${productOptions}
        </select>
      </div>

      <div class="field full">
        <label>NOTITIES</label>
        <textarea id="cfNote" placeholder="Optionele notitie...">${esc(c?.note||'')}</textarea>
      </div>
    </div>

    <div class="row" style="margin-top:16px;">
      <button class="btn" onclick="closeModal()">Annuleren</button>
      <button class="btn primary" onclick="saveCustomer('${esc(editId||'')}')">Opslaan</button>
    </div>
  `);
}

function saveCustomer(id) {
  const name = document.getElementById('cfName').value.trim();
  if (!name) { showToast('Vul a.u.b. een klantnaam in'); return; }

  const date = document.getElementById('cfDate').value || todayISO();
  const interval = Math.max(1, Number(document.getElementById('cfInterval').value || 30));
  const productId = document.getElementById('cfProduct').value;
  const p = product(productId);

  const c = {
    id: id || crypto.randomUUID(),
    name: name,
    contact: document.getElementById('cfContact').value.trim(),
    date: date,
    interval: interval,
    productId: productId,
    productName: p ? p.name : '',
    note: document.getElementById('cfNote').value.trim(),
    next: addDays(date, interval)
  };

  const index = data.customers.findIndex(x => x.id === c.id);
  if (index >= 0) data.customers[index] = c;
  else data.customers.push(c);

  save();
  closeModal();
  showToast('Klant opgeslagen!');
}

function markCustomerDone(id) {
  const c = customer(id);
  if (!c) return;

  const visitDate = c.next || todayISO();
  c.date = visitDate;
  c.next = addDays(visitDate, Math.max(1, Number(c.interval || 30)));

  data.logs.unshift({
    id: crypto.randomUUID(),
    customerId: id,
    customerName: c.name,
    date: new Date().toISOString(),
    text: 'Opvolging afgerond. Volgende datum ingesteld op ' + formatDate(c.next)
  });

  save();
  showToast('Opvolging geregistreerd for ' + c.name);
}

function deleteCustomer(id) {
  const c = customer(id);
  if (!c) return;

  openModal(`
    <h2>⚠️ Klant Verwijderen</h2>
    <p class="notice">Weet je zeker dat je <b>${esc(c.name)}</b> wilt verwijderen?</p>
    <div class="row">
      <button class="btn" onclick="closeModal()">Annuleren</button>
      <button class="btn danger" onclick="confirmDeleteCustomer('${esc(id)}')">Ja, Verwijderen</button>
    </div>
  `);
}

function confirmDeleteCustomer(id) {
  data.customers = data.customers.filter(x => x.id !== id);
  save();
  closeModal();
  showToast('Klant verwijderd.');
}

/* Product functionaliteiten */
function openProductModal() {
  openModal(`
    <h2>💊 Nieuw Product</h2>
    <div class="formgrid">
      <div class="field">
        <label>NAAM *</label>
        <input id="pfName" placeholder="bijv. Retatrutide">
      </div>
      <div class="field">
        <label>STERKTE / DOSERING</label>
        <input id="pfStrength" placeholder="bijv. 20 mg">
      </div>
    </div>
    <div class="row" style="margin-top:16px;">
      <button class="btn" onclick="closeModal()">Annuleren</button>
      <button class="btn primary" onclick="saveProduct()">Opslaan</button>
    </div>
  `);
}

function saveProduct() {
  const name = document.getElementById('pfName').value.trim();
  const strength = document.getElementById('pfStrength').value.trim();
  if (!name) { showToast('Vul een productnaam in'); return; }

  data.products.push({ id: crypto.randomUUID(), name, strength });
  save();
  closeModal();
  showToast('Product toegevoegd');
}

function deleteProduct(id) {
  data.products = data.products.filter(p => p.id !== id);
  save();
  showToast('Product verwijderd');
}

/* UI Rendering */
function customerHTML(c) {
  const p = product(c.productId);
  const [cls, label] = dueLabel(c.next);
  const prodLabel = p ? p.name + (p.strength ? ' · ' + p.strength : '') : (c.productName || 'Geen product');
  const cleanPhone = (c.contact || '').replace(/[^0-9+]/g, '');

  return `
    <article class="customer-card ${cls}">
      <div class="customer-top">
        <div style="min-width:0;flex:1">
          <div class="customer-name">${esc(c.name)}</div>
          
          ${cleanPhone ? `
            <div class="quick-actions">
              <a href="https://wa.me/${cleanPhone.replace('+','')}" target="_blank" class="action-link">💬 WhatsApp</a>
              <a href="tel:${cleanPhone}" class="action-link">📞 Bellen</a>
            </div>
          ` : ''}

          <div class="customer-info">
            <b>Product:</b> ${esc(prodLabel)}
            <br><b>Laatste Bezoek:</b> ${esc(formatDate(c.date))}
            <br><b>Volgende Opvolging:</b> ${esc(formatDate(c.next))}
          </div>

          ${c.note ? `<div class="customer-info">📝 <i>${esc(c.note)}</i></div>` : ''}
        </div>
        <span class="badge ${cls}">${esc(label)}</span>
      </div>

      <div class="row">
        <button class="btn sm" onclick="openCustomer('${esc(c.id)}')">Aanpassen</button>
        <button class="btn ok sm" onclick="markCustomerDone('${esc(c.id)}')">✓ Opgevolgd</button>
        <button class="btn danger sm" onclick="deleteCustomer('${esc(c.id)}')">Wis</button>
      </div>
    </article>
  `;
}

function render() {
  const query = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
  const due = data.customers.filter(c => c.next && dayDiff(todayISO(), c.next) <= 0);

  document.getElementById('totalCustomers').textContent = data.customers.length;
  document.getElementById('dueCustomers').textContent = due.length;

  const filtered = data.customers.filter(c => {
    const p = product(c.productId);
    const text = [c.name, c.contact, c.note, c.productName, p?.name].join(' ').toLowerCase();
    const matchesSearch = text.includes(query);

    if (!matchesSearch) return false;
    const diff = c.next ? dayDiff(todayISO(), c.next) : 999;
    if (currentFilter === 'due') return diff <= 0;
    if (currentFilter === 'soon') return diff <= 7;
    return true;
  }).sort((a,b) => (a.next || '9999').localeCompare(b.next || '9999'));

  document.getElementById('customerList').innerHTML = filtered.length
    ? filtered.map(customerHTML).join('')
    : `<div class="empty">Geen klanten gevonden.</div>`;

  // Render Products Tab
  document.getElementById('productList').innerHTML = data.products.map(p => `
    <div class="log-item">
      <div><b>${esc(p.name)}</b> ${p.strength ? `<span style="color:#8a98aa">(${esc(p.strength)})</span>` : ''}</div>
      <button class="btn danger sm" onclick="deleteProduct('${p.id}')">Verwijder</button>
    </div>
  `).join('');

  // Render Logs Tab
  document.getElementById('logList').innerHTML = data.logs.length ? data.logs.map(l => `
    <div class="log-item">
      <div><b>${esc(l.customerName || 'Klant')}</b>: ${esc(l.text)}</div>
      <div class="log-date">${new Date(l.date).toLocaleDateString('nl-BE')}</div>
    </div>
  `).join('') : `<div class="empty">Nog geen historiek aanwezig.</div>`;
}

/* Backup Import / Export */
function exportCustomers() {
  const content = JSON.stringify(data, null, 2);
  const blob = new Blob([content], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'prime-protocol-backup-' + todayISO() + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Backup gedownload');
}

function triggerImport() { document.getElementById('importFile').click(); }
function importCustomers(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      const imported = JSON.parse(evt.target.result);
      if (imported.customers) {
        data = imported;
        save();
        showToast('Gegevens succesvol ingevoerd!');
      } else {
        showToast('Ongeldig backup bestand');
      }
    } catch(err) {
      showToast('Fout bij het lezen van bestand');
    }
  };
  reader.readAsText(file);
}

// Inline Service Worker Register
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'prime-protocol-v6';
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
    self.addEventListener('fetch', e => {
      if (e.request.method !== 'GET') return;
      e.respondWith(
        fetch(e.request).catch(() => caches.match(e.request))
      );
    });
  `;
  const blob = new Blob([swCode], {type: 'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
}

render();
</script>
</body>
