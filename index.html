<style>
:root {
  --bg: #070b12;
  --panel: #101a2a;
  --line: #154b66;
  --cyan: #18d7ff;
  --purple: #7567ff;
  --text: #f5f8ff;
  --muted: #8492a6;
  --green: #00d79d;
  --amber: #ffb21c;
  --red: #ff5364;
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at 92% -5%, #102b45 0%, transparent 35%), var(--bg);
  color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
  user-select: none;
}

/* Scrollbar Customization */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: #070b12; }
::-webkit-scrollbar-thumb { background: #1c4a63; border-radius: 99px; }

.app-container {
  width: min(100%, 720px);
  margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 14px) 14px calc(90px + env(safe-area-inset-bottom));
}

.top-bar {
  border: 1px solid rgba(24, 215, 255, 0.25);
  background: linear-gradient(145deg, #111b2d, #0c1422);
  border-radius: 20px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  box-shadow: var(--shadow);
}

.btn-custom {
  border: 1px solid #1c5a75;
  background: #0d1b2b;
  color: #fff;
  border-radius: 12px;
  padding: 9px 15px;
  font-weight: 700;
  font-size: 13px;
  white-space: nowrap;
  min-height: 42px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.2s ease;
}

.btn-custom:active { transform: scale(0.96); }

.btn-custom.primary {
  background: linear-gradient(105deg, #09cbed, #7868ff);
  border: none;
  box-shadow: 0 4px 18px rgba(9, 203, 237, 0.35);
}

.btn-custom.danger { border-color: #71303a; color: #ff7580; background: #221016; }
.btn-custom.ok { border-color: #08795e; color: #00e3a4; background: #09241f; }

.stat-card {
  background: linear-gradient(145deg, #101a2b, #0c1421);
  border: 1px solid #15465c;
  border-radius: 16px;
  padding: 14px;
}

.customer-card {
  padding: 15px;
  border: 1px solid #1d4055;
  border-radius: 16px;
  background: #0a111b;
  margin-top: 10px;
  transition: border-color 0.2s ease;
}

.customer-card.due {
  border-color: var(--red);
  background: linear-gradient(135deg, rgba(255, 83, 100, 0.08), #0a111b 65%);
}

.customer-card.soon {
  border-color: #9a6a12;
  background: linear-gradient(135deg, rgba(255, 178, 28, 0.06), #0a111b 65%);
}

.badge {
  display: inline-flex;
  align-items: center;
  border: 1px solid #1d826c;
  color: #00dba0;
  background: rgba(0, 219, 160, 0.1);
  border-radius: 999px;
  padding: 4px 10px;
  font-size: 10px;
  font-weight: 800;
  white-space: nowrap;
  letter-spacing: 0.5px;
}

.badge.due { border-color: var(--red); color: #ff7884; background: rgba(255, 83, 100, 0.15); }
.badge.soon { border-color: #a86e00; color: #ffbd2e; background: rgba(255, 178, 28, 0.15); }

/* Bottom Fixed Navigation */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(10, 17, 27, 0.94);
  backdrop-filter: blur(14px);
  border-top: 1px solid #16364a;
  z-index: 40;
  padding-bottom: env(safe-area-inset-bottom);
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 10px 0;
  color: #7f8da2;
  font-size: 11px;
  font-weight: 600;
  transition: color 0.2s ease;
}

.nav-item.active { color: #18d7ff; }

/* Modals & Dialogs */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(4, 7, 13, 0.84);
  backdrop-filter: blur(6px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 14px;
  z-index: 50;
  opacity: 0;
  transition: opacity 0.2s ease;
}

.modal.show { display: flex; opacity: 1; }

.modalbox {
  width: min(560px, 100%);
  max-height: 88vh;
  overflow-y: auto;
  background: #0d1624;
  border: 1px solid #1b536b;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  transform: translateY(15px);
  transition: transform 0.2s ease;
}

.modal.show .modalbox { transform: translateY(0); }

.field input, .field select, .field textarea {
  width: 100%;
  background: #070d17;
  color: #f4f7fb;
  border: 1px solid #203f54;
  border-radius: 10px;
  padding: 11px 13px;
  outline: none;
  font-size: 15px;
}

.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 2px rgba(24, 215, 255, 0.15);
}

/* Toast System */
#toast-container {
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
  width: min(92%, 400px);
}

.toast {
  background: #102133;
  border: 1px solid #18d7ff;
  color: #fff;
  padding: 12px 18px;
  border-radius: 14px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  animation: slideDown 0.3s ease forwards;
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

.filter-chip {
  padding: 6px 14px;
  border-radius: 99px;
  border: 1px solid #1c4359;
  font-size: 12px;
  font-weight: 700;
  color: #8492a6;
  background: #0b1422;
  white-space: nowrap;
}

.filter-chip.active {
  background: rgba(24, 215, 255, 0.15);
  border-color: #18d7ff;
  color: #18d7ff;
}
</style>
</head>

<body>

<div id="toast-container"></div>

<div class="app-container">

  <!-- Header Banner -->
  <header class="top-bar mb-4">
    <div class="flex items-center">

<!-- App Navigation Bar -->

<!-- Dialog Modals -->

<script>
'use strict';

// -------------------------------------------------------------
// 1. INLINE SERVICE WORKER & PWA REGISTRATION
// -------------------------------------------------------------
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE_NAME = 'prime-protocol-pwa-v6';
    self.addEventListener('install', e => {
      self.skipWaiting();
    });
    self.addEventListener('activate', e => {
      e.waitUntil(clients.claim());
    });
    self.addEventListener('fetch', e => {
      e.respondWith(
        fetch(e.request).catch(() => caches.match(e.request))
      );
    });
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob);

  navigator.serviceWorker.register(swUrl)
    .then(() => console.log('PWA Service Worker Actief'))
    .catch(err => console.error('SW Registratie Fout:', err));
}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const banner = document.getElementById('pwaInstallBanner');
  if (banner) banner.classList.remove('hidden');
});

// Safari iOS Detection
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;

if (isIOS && !isStandalone) {
  window.addEventListener('DOMContentLoaded', () => {
    const banner = document.getElementById('pwaInstallBanner');
    const msg = document.getElementById('installMsg');
    const btn = document.getElementById('pwaInstallBtn');
    if (banner && msg && btn) {
      banner.classList.remove('hidden');
      msg.textContent = 'Tik in Safari op "Delen" ➔ "Zet op beginชerm"';
      btn.style.display = 'none';
    }
  });
}

function triggerPwaInstall() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then((choiceResult) => {
      if (choiceResult.outcome === 'accepted') {
        document.getElementById('pwaInstallBanner')?.classList.add('hidden');
      }
      deferredPrompt = null;
    });
  }
}

// -------------------------------------------------------------
// 2. APP STATE & PERSISTENCE
// -------------------------------------------------------------
const KEY = 'primeProtocolMobileV6';
let data = loadData();
let currentTab = 'customers';
let activeFilter = 'all';

function freshData() {
  return {
    customers: [],
    products: [
      ...['Retatrutide', 'Tirzepatide', 'Semaglutide'].flatMap(name =>
        [10, 20, 30, 40, 50].map(mg => ({
          id: crypto.randomUUID(), name: name, strength: mg + ' mg'
        }))
      )
    ],
    logs: [],
    settings: { customerInterval: 30 }
  };
}

function loadData() {
  try {
    const saved = JSON.parse(localStorage.getItem(KEY));
    if (!saved) return freshData();

    saved.customers = saved.customers || [];
    saved.products = saved.products || [];

    for (const name of ['Retatrutide', 'Tirzepatide']) {
      for (const mg of [10, 20, 30, 40, 50]) {
        const strength = mg + ' mg';
        const exists = saved.products.some(p =>
          String(p.name || '').trim().toLowerCase() === name.toLowerCase() &&
          String(p.strength || '').trim().toLowerCase() === strength.toLowerCase()
        );
        if (!exists) {
          saved.products.push({ id: crypto.randomUUID(), name, strength });
        }
      }
    }

    saved.logs = saved.logs || [];
    saved.settings = Object.assign({ customerInterval: 30 }, saved.settings || {});
    return saved;
  } catch (e) {
    console.error(e);
    return freshData();
  }
}

function saveData() {
  try {
    localStorage.setItem(KEY, JSON.stringify(data));
    renderCurrentTab();
  } catch (e) {
    showToast('Opslaan mislukt. Browseropslag vol.');
  }
}

// Helpers
function esc(val) {
  return String(val ?? '').replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[m]));
}

function todayISO() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}

function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T12:00:00');
  d.setDate(d.getDate() + Number(n));
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

function dayDiff(a, b) {
  return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
}

function formatDate(dateStr) {
  if (!dateStr) return 'Niet ingesteld';
  const parts = dateStr.split('-');
  return parts.length === 3 ? `${parts[2]}-${parts[1]}-${parts[0]}` : dateStr;
}

function formatDateTime(isoStr) {
  if (!isoStr) return '';
  const d = new Date(isoStr);
  return d.toLocaleDateString('nl-BE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function getProduct(id) { return data.products.find(p => p.id === id); }
function getCustomer(id) { return data.customers.find(c => c.id === id); }

function dueStatus(dateStr) {
  if (!dateStr) return { cls: '', label: 'GEPLAND', diff: 999 };
  const diff = dayDiff(todayISO(), dateStr);
  if (diff < 0) return { cls: 'due', label: `TE LAAT (${Math.abs(diff)}d)`, diff };
  if (diff === 0) return { cls: 'due', label: 'VANDAAG', diff };
  if (diff <= 7) return { cls: 'soon', label: `BINNEN ${diff}d`, diff };
  return { cls: '', label: `IN ${diff}d`, diff };
}

// Feedback Modals
function showToast(msg) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = `<span>${esc(msg)}</span>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.3s ease';
    setTimeout(() => toast.remove(), 300);
  }, 2500);
}

function customConfirm(title, message, icon, onConfirm) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmMessage').textContent = message;
  document.getElementById('confirmIcon').textContent = icon || '⚠️';
  
  const actionBtn = document.getElementById('confirmBtnAction');
  actionBtn.onclick = () => {
    closeConfirmModal();
    onConfirm();
  };
  
  document.getElementById('confirmModal').classList.add('show');
}

function closeConfirmModal() {
  document.getElementById('confirmModal').classList.remove('show');
}

// Navigation Controls
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById(`nav-${tab}`)?.classList.add('active');
  renderCurrentTab();
}

function setFilter(filter) {
  activeFilter = filter;
  renderCurrentTab();
}

function renderCurrentTab() {
  const container = document.getElementById('mainContent');
  if (currentTab === 'customers') renderCustomersView(container);
  else if (currentTab === 'products') renderProductsView(container);
  else if (currentTab === 'logs') renderLogsView(container);
  else if (currentTab === 'settings') renderSettingsView(container);
}

// -------------------------------------------------------------
// 3. TAB VIEWS
// -------------------------------------------------------------
function renderCustomersView(container) {
  const dueCount = data.customers.filter(c => c.next && dayDiff(todayISO(), c.next) <= 0).length;
  const soonCount = data.customers.filter(c => {
    const d = c.next ? dayDiff(todayISO(), c.next) : 999;
    return d > 0 && d <= 7;
  }).length;

  container.innerHTML = `
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="stat-card">
        <span class="block text-[#8391a6] text-[10px] font-extrabold tracking-wider">TOTAAL KLANTEN</span>
        <b class="block text-3xl font-extrabold mt-1 text-cyan-400">${data.customers.length}</b>
      </div>
      <div class="stat-card">
        <span class="block text-[#8391a6] text-[10px] font-extrabold tracking-wider">OPVOLGING NODIG</span>
        <b class="block text-3xl font-extrabold mt-1 ${dueCount > 0 ? 'text-red-400' : 'text-emerald-400'}">${dueCount}</b>
      </div>
    </div>

    <div class="bg-gradient-to-b from-[#0f192a] to-[#0b1422] border border-[#15465c] rounded-2xl p-4 shadow-xl">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-bold tracking-wider text-cyan-400 flex items-center gap-2">
          <span>👤</span> KLANTEN OVERZICHT
        </h2>
      </div>

      <div class="relative mb-3">
        <input id="searchInput" type="search"
          placeholder="🔎 Zoek op naam, product of telefoonnr..."
          oninput="renderCustomerList()"
          class="w-full bg-[#0a111c] text-white border border-[#234155] rounded-xl px-4 py-3 text-sm focus:border-cyan-400 outline-none">
      </div>

      <div class="flex gap-2 mb-4 overflow-x-auto pb-1">
        <button onclick="setFilter('all')" class="filter-chip ${activeFilter === 'all' ? 'active' : ''}">Alles (${data.customers.length})</button>
        <button onclick="setFilter('due')" class="filter-chip ${activeFilter === 'due' ? 'active' : ''}">⚠️ Te laat (${dueCount})</button>
        <button onclick="setFilter('soon')" class="filter-chip ${activeFilter === 'soon' ? 'active' : ''}">⏳ Binnen 7d (${soonCount})</button>
      </div>

      <div id="customerList"></div>
    </div>
  `;
  renderCustomerList();
}

function renderCustomerList() {
  const query = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
  
  const filtered = data.customers.filter(c => {
    const p = getProduct(c.productId);
    const text = [c.name, c.contact, c.note, c.productName, p?.name].join(' ').toLowerCase();
    const matchesSearch = text.includes(query);
    
    const diff = c.next ? dayDiff(todayISO(), c.next) : 999;
    if (activeFilter === 'due') return matchesSearch && diff <= 0;
    if (activeFilter === 'soon') return matchesSearch && diff > 0 && diff <= 7;
    return matchesSearch;
  }).sort((a, b) => (a.next || '9999-12-31').localeCompare(b.next || '9999-12-31'));

  const listEl = document.getElementById('customerList');
  if (!listEl) return;

  if (filtered.length === 0) {
    listEl.innerHTML = `<div class="p-8 text-center text-slate-400 border border-dashed border-slate-700/60 rounded-xl text-xs">Geen klanten gevonden.</div>`;
    return;
  }

  listEl.innerHTML = filtered.map(c => {
    const p = getProduct(c.productId);
    const status = dueStatus(c.next);
    const productName = p ? `${p.name} ${p.strength ? '· ' + p.strength : ''}` : (c.productName || 'Geen specifieke kit');
    const isCleanPhone = c.contact && /^[0-9+ ]+$/.test(c.contact.trim());

    return `
      <article class="customer-card ${status.cls}">
        <div class="flex justify-between items-start gap-3">
          <div class="min-w-0 flex-1">
            <h3 class="text-base font-extrabold text-white truncate">${esc(c.name)}</h3>

            ${c.contact ? `
              <div class="text-xs text-slate-400 mt-1 flex items-center gap-2">
                <span>📞 ${esc(c.contact)}</span>
                ${isCleanPhone ? `
                  <a href="https://wa.me/${c.contact.replace(/[^0-9]/g, '')}" target="_blank" rel="noopener" class="text-emerald-400 font-semibold text-[11px]">💬 WhatsApp</a>
                ` : ''}
              </div>
            ` : ''}

            <div class="text-xs text-slate-300 mt-2 space-y-0.5 bg-[#070d17]/60 p-2.5 rounded-lg border border-slate-800">
              <div>📦 <span class="font-semibold text-cyan-300">${esc(productName)}</span></div>
              <div class="text-slate-400">📅 Bezoek: <span class="text-slate-200">${esc(formatDate(c.date))}</span></div>
              <div class="text-slate-400">🔄 Volgende: <span class="text-slate-200 font-semibold">${esc(formatDate(c.next))}</span> (${c.interval}d interval)</div>
            </div>

            ${c.note ? `
              <div class="text-xs text-amber-200/90 mt-2 italic bg-amber-950/20 border border-amber-900/30 p-2 rounded-lg">
                📝 ${esc(c.note)}
              </div>
            ` : ''}
          </div>

          <span class="badge ${status.cls}">${esc(status.label)}</span>
        </div>

        <div class="flex gap-2 justify-end mt-3 pt-2 border-t border-slate-800/80">
          <button class="btn-custom" onclick="openCustomerModal('${esc(c.id)}')">✏️ Bewerken</button>
          ${status.diff <= 0 ? `
            <button class="btn-custom ok" onclick="markFollowUpDone('${esc(c.id)}')">✓ Opgevolgd</button>
          ` : ''}
          <button class="btn-custom danger" onclick="deleteCustomerConfirm('${esc(c.id)}')">🗑️</button>
        </div>
      </article>
    `;
  }).join('');
}

function renderProductsView(container) {
  container.innerHTML = `
    <div class="bg-gradient-to-b from-[#0f192a] to-[#0b1422] border border-[#15465c] rounded-2xl p-4 shadow-xl">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 class="text-sm font-bold tracking-wider text-cyan-400">📦 PRODUCTEN BEHEER</h2>
          <p class="text-xs text-slate-400">Beheer je beschikbare varianten en doseringen.</p>
        </div>
        <button class="btn-custom primary" onclick="openProductModal()">+ Product</button>
      </div>

      <div class="space-y-2">
        ${data.products.map(p => `
          <div class="flex items-center justify-between p-3 bg-[#0a111b] border border-[#1d4055] rounded-xl">
            <div>
              <div class="font-bold text-sm text-white">${esc(p.name)}</div>
              <div class="text-xs text-cyan-400 font-medium">${esc(p.strength || 'Standaard')}</div>
            </div>
            <div class="flex gap-2">
              <button class="btn-custom" onclick="openProductModal('${esc(p.id)}')">✏️</button>
              <button class="btn-custom danger" onclick="deleteProductConfirm('${esc(p.id)}')">🗑️</button>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function renderLogsView(container) {
  container.innerHTML = `
    <div class="bg-gradient-to-b from-[#0f192a] to-[#0b1422] border border-[#15465c] rounded-2xl p-4 shadow-xl">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-bold tracking-wider text-cyan-400">📋 ACTIVITEITEN HISTORIEK</h2>
        ${data.logs.length > 0 ? `<button class="btn-custom danger" onclick="clearLogsConfirm()">Wis Log</button>` : ''}
      </div>

      ${data.logs.length === 0 ? `
        <div class="p-8 text-center text-slate-400 border border-dashed border-slate-700/60 rounded-xl text-xs">Geen geregistreerde activiteiten.</div>
      ` : `
        <div class="space-y-2">
          ${data.logs.map(log => `
            <div class="p-3 bg-[#0a111b] border border-slate-800 rounded-xl text-xs flex justify-between items-center">
              <div>
                <div class="text-slate-200 font-semibold">${esc(log.text)}</div>
                <div class="text-[10px] text-slate-500 mt-0.5">${esc(formatDateTime(log.date))}</div>
              </div>
              <span class="text-[10px] bg-cyan-950 text-cyan-400 border border-cyan-800/60 px-2 py-0.5 rounded-full font-bold">Opvolging</span>
            </div>
          `).join('')}
        </div>
      `}
    </div>
  `;
}

function renderSettingsView(container) {
  container.innerHTML = `
    <div class="bg-gradient-to-b from-[#0f192a] to-[#0b1422] border border-[#15465c] rounded-2xl p-4 shadow-xl space-y-5">
      <div>
        <h2 class="text-sm font-bold tracking-wider text-cyan-400 mb-1">⚙️ INSTELLINGEN & BACKUP</h2>
        <p class="text-xs text-slate-400">Beheer standaard intervals en database synchronisatie.</p>
      </div>

      <div class="field">
        <label class="block text-xs font-bold text-slate-400 mb-1">STANDAARD OPVOLGINTERVAL (DAGEN)</label>
        <div class="flex gap-2">
          <input id="settingInterval" type="number" value="${data.settings.customerInterval || 30}" class="flex-1">
          <button class="btn-custom primary" onclick="saveSettings()">Opslaan</button>
        </div>
      </div>

      <hr class="border-slate-800">

      <div>
        <h3 class="text-xs font-bold text-slate-300 mb-2 uppercase tracking-wider">📦 Backup Beheer</h3>
        <div class="grid grid-cols-2 gap-3">
          <button class="btn-custom" onclick="exportCustomers()">📥 Export JSON</button>
          <button class="btn-custom" onclick="importCustomers()">📤 Import JSON</button>
        </div>
      </div>

      <hr class="border-slate-800">

      <div class="bg-red-950/20 border border-red-900/40 p-3.5 rounded-xl">
        <h3 class="text-xs font-bold text-red-400 mb-1">⚠️ Gevarenzone</h3>
        <p class="text-[11px] text-slate-400 mb-3">Verwijder alle lokale gegevens en herstel de fabrieksinstellingen.</p>
        <button class="btn-custom danger w-full" onclick="resetAllConfirm()">Alles Wissen</button>
      </div>
    </div>
  `;
}

// -------------------------------------------------------------
// 4. ACTION HANDLERS
// -------------------------------------------------------------
function openModal(html) {
  document.getElementById('modalbox').innerHTML = html;
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});

function openCustomerModal(editId = null) {
  const c = editId ? getCustomer(editId) : null;
  const interval = c?.interval || data.settings.customerInterval || 30;

  const productOptions = data.products.map(p =>
    `<option value="${esc(p.id)}" ${c?.productId === p.id ? 'selected' : ''}>${esc(p.name)} ${p.strength ? '· ' + esc(p.strength) : ''}</option>`
  ).join('');

  openModal(`
    <h2 class="text-lg font-bold text-white mb-4">${c ? '✏️ Klant Bewerken' : '👤 Nieuwe Klant'}</h2>
    <div class="space-y-3">
      <div class="field">
        <label class="block text-[11px] font-bold text-slate-400 mb-1">NAAM *</label>
        <input id="cfName" value="${esc(c?.name || '')}" placeholder="Klantnaam" autocomplete="name">
      </div>
      <div class="field">
        <label class="block text-[11px] font-bold text-slate-400 mb-1">CONTACT / TELEFOONNR</label>
        <input id="cfContact" value="${esc(c?.contact || '')}" placeholder="+32 ...">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div class="field">
          <label class="block text-[11px] font-bold text-slate-400 mb-1">DATUM BEZOEK</label>
          <input id="cfDate" type="date" value="${esc(c?.date || todayISO())}">
        </div>
        <div class="field">
          <label class="block text-[11px] font-bold text-slate-400 mb-1">INTERVAL (DAGEN)</label>
          <input id="cfInterval" type="number" min="1" value="${esc(interval)}">
        </div>
      </div>
      <div class="field">
        <label class="block text-[11px] font-bold text-slate-400 mb-1">PRODUCT / DOSERING</label>
        <select id="cfProduct">
          <option value="">Geen product gekoppeld</option>
          ${productOptions}
        </select>
      </div>
      <div class="field">
        <label class="block text-[11px] font-bold text-slate-400 mb-1">NOTITIES</label>
        <textarea id="cfNote" rows="3" placeholder="Optionele notitie...">${esc(c?.note || '')}</textarea>
      </div>
    </div>
    <div class="flex gap-2 justify-end mt-5 pt-3 border-t border-slate-800">
      <button class="btn-custom" onclick="closeModal()">Annuleren</button>
      <button class="btn-custom primary" onclick="saveCustomer('${esc(editId || '')}')">Opslaan</button>
    </div>
  `);
}

function saveCustomer(id) {
  const name = document.getElementById('cfName').value.trim();
  if (!name) return showToast('⚠️ Vul een naam in.');

  const date = document.getElementById('cfDate').value || todayISO();
  const interval = Math.max(1, Number(document.getElementById('cfInterval').value || 30));
  const productId = document.getElementById('cfProduct').value;
  const selectedProd = getProduct(productId);

  const c = {
    id: id || crypto.randomUUID(),
    name,
    contact: document.getElementById('cfContact').value.trim(),
    date,
    interval,
    productId: productId || '',
    productName: selectedProd ? selectedProd.name : '',
    note: document.getElementById('cfNote').value.trim(),
    next: addDays(date, interval)
  };

  const idx = data.customers.findIndex(x => x.id === c.id);
  if (idx >= 0) data.customers[idx] = c;
  else data.customers.push(c);

  saveData();
  closeModal();
  showToast('Klant opgeslagen!');
}

function markFollowUpDone(id) {
  const c = getCustomer(id);
  if (!c) return;

  customConfirm('Opvolging Registreren', `Registreer opvolging voor ${c.name}?`, '✅', () => {
    const visitDate = c.next || todayISO();
    c.date = visitDate;
    c.next = addDays(visitDate, Math.max(1, Number(c.interval || 30)));

    data.logs.unshift({
      id: crypto.randomUUID(),
      type: 'followup',
      customerId: id,
      date: new Date().toISOString(),
      text: `${c.name} · Opvolging geregistreerd`
    });

    saveData();
    showToast('Opvolging afgerond!');
  });
}

function deleteCustomerConfirm(id) {
  const c = getCustomer(id);
  if (!c) return;

  customConfirm('Klant Verwijderen', `Verwijder ${c.name} definitief?`, '🗑️', () => {
    data.customers = data.customers.filter(x => x.id !== id);
    saveData();
    showToast('Klant verwijderd.');
  });
}

function openProductModal(editId = null) {
  const p = editId ? getProduct(editId) : null;
  openModal(`
    <h2 class="text-lg font-bold text-white mb-4">${p ? '✏️ Product Bewerken' : '📦 Nieuw Product'}</h2>
    <div class="space-y-3">
      <div class="field">
        <label class="block text-[11px] font-bold text-slate-400 mb-1">PRODUCTNAAM *</label>
        <input id="pfName" value="${esc(p?.name || '')}" placeholder="bijv. Retatrutide">
      </div>
      <div class="field">
        <label class="block text-[11px] font-bold text-slate-400 mb-1">DOSERING / STERKTE</label>
        <input id="pfStrength" value="${esc(p?.strength || '')}" placeholder="bijv. 20 mg">
      </div>
    </div>
    <div class="flex gap-2 justify-end mt-5 pt-3 border-t border-slate-800">
      <button class="btn-custom" onclick="closeModal()">Annuleren</button>
      <button class="btn-custom primary" onclick="saveProduct('${esc(editId || '')}')">Opslaan</button>
    </div>
  `);
}

function saveProduct(id) {
  const name = document.getElementById('pfName').value.trim();
  const strength = document.getElementById('pfStrength').value.trim();

  if (!name) return showToast('⚠️ Vul een naam in.');

  const p = { id: id || crypto.randomUUID(), name, strength };
  const idx = data.products.findIndex(x => x.id === p.id);
  if (idx >= 0) data.products[idx] = p;
  else data.products.push(p);

  saveData();
  closeModal();
  showToast('Product opgeslagen');
}

function deleteProductConfirm(id) {
  const p = getProduct(id);
  if (!p) return;

  customConfirm('Product Verwijderen', `Verwijder ${p.name}?`, '📦', () => {
    data.products = data.products.filter(x => x.id !== id);
    saveData();
    showToast('Product verwijderd');
  });
}

function clearLogsConfirm() {
  customConfirm('Historiek Wissen', 'Wilt u het logboek leegmaken?', '🧹', () => {
    data.logs = [];
    saveData();
    showToast('Historiek gewist.');
  });
}

function saveSettings() {
  const val = Number(document.getElementById('settingInterval').value);
  if (val > 0) {
    data.settings.customerInterval = val;
    saveData();
    showToast('Instellingen opgeslagen');
  }
}

function resetAllConfirm() {
  customConfirm('Volledige Reset', 'Wis alle opgeslagen gegevens?', '⚠️', () => {
    localStorage.removeItem(KEY);
    data = freshData();
    saveData();
    showToast('Gegevens gereset.');
  });
}

function exportCustomers() {
  const content = JSON.stringify(data, null, 2);
  const blob = new Blob([content], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `prime-protocol-backup-${todayISO()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Backup gedownload!');
}

function importCustomers() { document.getElementById('importFile').click(); }

function handleImportFile(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (imported && (Array.isArray(imported.customers) || Array.isArray(imported.products))) {
        customConfirm('Gegevens Importeren', 'Wilt u de gegevens samenvoegen met uw huidige databank?', '📥', () => {
          if (Array.isArray(imported.customers)) {
            const ids = new Set(data.customers.map(c => c.id));
            imported.customers.forEach(c => { if (!ids.has(c.id)) data.customers.push(c); });
          }
          if (Array.isArray(imported.products)) {
            const pIds = new Set(data.products.map(p => p.id));
            imported.products.forEach(p => { if (!pIds.has(p.id)) data.products.push(p); });
          }
          saveData();
          showToast('Gegevens geïmporteerd!');
        });
      }
    } catch (err) {
      showToast('⚠️ Ongeldig bestand.');
    }
  };
  reader.readAsText(file);
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// Launch App
renderCurrentTab();
</script>
