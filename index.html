<!doctype html>
<html lang="nl">
<head>
<meta name="prime-version" content="v5">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070708">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<title>Prime Protocol</title>
<style>
:root{--bg:#070708;--card:#111113;--card2:#18181b;--line:#29292e;--txt:#f5f5f7;--muted:#8e8e96;--red:#ff5f61;--green:#55d58e;--amber:#f2b84b}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{min-height:100vh}.app{width:min(100%,430px);margin:auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(82px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 1px 16px}.brand{font-size:14px;font-weight:900;letter-spacing:2.5px}.sub{font-size:9px;color:var(--muted);letter-spacing:1.4px;margin-top:3px}
button,input,select,textarea{font:inherit}button{cursor:pointer}.btn{border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:12px;padding:9px 12px;font-weight:750;font-size:12px}.btn.primary{background:#f2f2f4;color:#080809;border-color:#f2f2f4}.btn.danger{color:var(--red)}
.hero{border:1px solid var(--line);border-radius:20px;padding:17px;margin-bottom:9px;background:linear-gradient(145deg,#19191c,#0e0e10)}.eyebrow{font-size:8px;color:#a4a4aa;letter-spacing:1.7px}.hero h1{font-size:25px;line-height:1.05;margin:7px 0 5px}.hero p{margin:0;color:var(--muted);font-size:11px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:15px}.stat{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:11px}.stat small{font-size:7px;color:var(--muted);letter-spacing:1px}.stat b{display:block;font-size:21px;margin-top:3px}.stat.due b{color:var(--red)}
.head{display:flex;justify-content:space-between;align-items:center;margin:15px 2px 7px}.head h2{font-size:14px;margin:0}.muted{font-size:10px;color:var(--muted)}
.dose,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin:7px 0}.dose{border-left:4px solid var(--line)}.dose.due{border-left-color:var(--red);background:linear-gradient(90deg,rgba(255,95,97,.10),var(--card) 36%)}.dose.upcoming{border-left-color:var(--amber)}.dose.done{border-left-color:var(--green)}.row{display:flex;justify-content:space-between;align-items:center;gap:9px}.name{font-size:14px;font-weight:850}.meta{font-size:10px;color:var(--muted);margin-top:4px}.badge{font-size:7px;letter-spacing:.8px;font-weight:900;border:1px solid var(--line);border-radius:999px;padding:5px 7px;white-space:nowrap}.badge.red{color:var(--red);border-color:#633336}.badge.green{color:var(--green);border-color:#2d5b45}.badge.amber{color:var(--amber);border-color:#604d28}.actions{display:flex;gap:6px;margin-top:9px}.actions>*{flex:1}.empty{border:1px dashed var(--line);border-radius:15px;padding:18px;text-align:center;color:var(--muted);font-size:11px}
.nav{position:fixed;z-index:20;left:0;right:0;bottom:0;background:rgba(8,8,9,.95);backdrop-filter:blur(18px);border-top:1px solid var(--line)}.navin{width:min(430px,100%);margin:auto;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 7px calc(6px + env(safe-area-inset-bottom));gap:2px}.navbtn{border:0;background:none;color:var(--muted);border-radius:11px;padding:6px 1px;font-size:8px}.navbtn.active{background:#19191c;color:#fff}.ico{display:block;font-size:16px;line-height:16px;margin-bottom:2px}
.modal{display:none;position:fixed;z-index:30;inset:0;background:rgba(0,0,0,.72);align-items:flex-end}.modal.show{display:flex}.sheet{width:min(100%,430px);max-height:92vh;overflow:auto;background:#111113;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:17px 14px calc(18px + env(safe-area-inset-bottom));margin:auto auto 0}.sheet h2{font-size:19px;margin:0 0 13px}label{display:block;font-size:8px;letter-spacing:1.2px;color:#aaaab0;margin:11px 0 5px}input,select,textarea{width:100%;background:#08080a;color:#fff;border:1px solid #34343a;border-radius:11px;padding:10px;font-size:13px}textarea{min-height:60px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}.intervals{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.intervals button{border:1px solid var(--line);background:#09090b;color:#aaa;border-radius:9px;padding:9px 2px;font-size:9px}.intervals button.active{background:#ededf0;color:#080809;border-color:#ededf0;font-weight:850}.modal-actions{display:flex;gap:7px;margin-top:15px}.modal-actions>*{flex:1}.hint{font-size:9px;line-height:1.4;color:#707078;margin-top:8px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.weekday{text-align:center;font-size:8px;color:var(--muted)}.day{min-height:52px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:5px;font-size:9px}.day.today{outline:1px solid #ddd}.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--red);margin:5px 2px 0 0}.dot.done{background:var(--green)}
.bar{height:4px;background:#28282c;border-radius:99px;overflow:hidden;margin:9px 0 3px}.fill{height:100%;background:#bdbdc2}.low .fill{background:var(--amber)}.emptyStock .fill{background:var(--red)}
.history{display:flex;justify-content:space-between;gap:7px;padding:10px 0;border-bottom:1px solid #252529}.history:last-child{border-bottom:0}
</style>
</head>
<body>
<div id="app"></div><div class="nav"><div id="nav" class="navin"></div></div>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>
<script>
const KEY="prime_protocol_v4";
let data=JSON.parse(localStorage.getItem(KEY)||'{"protocols":[],"logs":[],"stock":[],"settings":{}}');
data.protocols=data.protocols||[];data.logs=data.logs||[];data.stock=data.stock||[];data.settings=data.settings||{};
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const save=()=>localStorage.setItem(KEY,JSON.stringify(data)), iso=d=>d.toISOString().slice(0,10), today=()=>iso(new Date()), D=s=>new Date(s+"T12:00:00"), fmt=s=>D(s).toLocaleDateString("nl-BE",{day:"2-digit",month:"short"}), days=(a,b)=>Math.round((D(b)-D(a))/86400000);
function last(p){return [...data.logs].filter(x=>x.protocolId===p.id).sort((a,b)=>b.timestamp-a.timestamp)[0]}
function interval(p){return p.interval===1?"Daily":`Every ${p.interval} days`}
function next(p){if(!p.start)return null;let l=last(p),d=D(l?.date||p.start),t=D(today());if(l&&l.date===today())d.setDate(d.getDate()+p.interval);else while(d<t)d.setDate(d.getDate()+p.interval);let s=iso(d);return p.end&&s>p.end?null:s}
function state(p){let n=next(p);if(!n)return["none","—",null];let x=days(today(),n);return x===0?["due","DUE TODAY",n]:x<0?["due",`OVERDUE ${Math.abs(x)}D`,n]:["upcoming",x===1?"TOMORROW":`IN ${x} DAYS`,n]}
function nav(active){let a=[["dashboard","⌂","Home"],["protocols","◈","Protocols"],["calendar","□","Calendar"],["stock","▣","Stock"],["history","≡","History"]];$("#nav").innerHTML=a.map(x=>`<button class="navbtn ${active===x[0]?"active":""}" onclick="page('${x[0]}')"><span class="ico">${x[1]}</span>${x[2]}</button>`).join("")}
function page(x="dashboard"){({dashboard,protocols,calendar,stock,history}[x]||dashboard)();nav(x);scrollTo(0,0)}
function card(p){let s=state(p),l=last(p);return `<div class="dose ${s[0]}"><div class="row"><div><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.amount)} ${esc(p.unit)} · ${interval(p)}</div></div><span class="badge ${s[0]==="due"?"red":"amber"}">${s[1]}</span></div><div class="meta">Next: ${s[2]?fmt(s[2]):"—"}${l?" · Last: "+fmt(l.date):""}</div>${s[0]==="due"?`<div class="actions"><button class="btn primary" onclick="logDose('${p.id}')">✓ Mark completed</button><button class="btn" onclick="editProtocol('${p.id}')">Edit</button></div>`:`<div class="actions"><button class="btn" onclick="editProtocol('${p.id}')">Edit protocol</button></div>`}</div>`}
function dashboard(){let a=data.protocols.filter(p=>p.active),due=a.filter(p=>state(p)[0]==="due"),up=a.filter(p=>state(p)[0]==="upcoming");$("#app").innerHTML=`<main class="app"><div class="top"><div><div class="brand">PRIME PROTOCOL</div><div class="sub">TODAY'S CONTROL CENTER</div></div><button class="btn primary" onclick="openProtocol()">+ Add</button></div><div class="hero"><div class="eyebrow">${new Date().toLocaleDateString("nl-BE",{weekday:"long",day:"numeric",month:"long"})}</div><h1>${due.length?"ACTION REQUIRED":"ALL CLEAR"}</h1><p>${due.length?`${due.length} item${due.length>1?"s are":" is"} due right now.`:"Nothing is due right now."}</p></div><div class="summary"><div class="stat due"><small>DUE NOW</small><b>${due.length}</b></div><div class="stat"><small>UP NEXT</small><b>${up.length}</b></div><div class="stat"><small>ACTIVE</small><b>${a.length}</b></div></div><div class="head"><h2>🔴 Needs attention</h2><span class="muted">${due.length}</span></div>${due.map(card).join("")||'<div class="empty">✓ Nothing due right now</div>'}<div class="head"><h2>Next up</h2><span class="muted">${up.length}</span></div>${up.sort((x,y)=>state(x)[2].localeCompare(state(y)[2])).slice(0,5).map(card).join("")||'<div class="empty">No upcoming protocols.</div>'}</main>`}
function protocols(){$("#app").innerHTML=`<main class="app"><div class="top"><div><div class="brand">PROTOCOLS</div><div class="sub">SCHEDULES</div></div><button class="btn primary" onclick="openProtocol()">+ Add</button></div>${data.protocols.map(p=>{let s=state(p);return `<div class="card"><div class="row"><div><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.amount)} ${esc(p.unit)} · ${interval(p)}</div></div><span class="badge ${s[0]==="due"?"red":s[0]==="upcoming"?"amber":"green"}">${s[1]}</span></div><div class="meta">Next: ${s[2]?fmt(s[2]):"—"} · ${p.active?"Active":"Paused"}</div><div class="actions"><button class="btn" onclick="logDose('${p.id}')">Log</button><button class="btn" onclick="editProtocol('${p.id}')">Edit</button></div></div>`}).join("")||'<div class="empty">No protocols yet.</div>'}</main>`}
function calendar(){let z=new Date();z.setDate(1);z.setHours(12,0,0,0);let first=(z.getDay()+6)%7,total=new Date(z.getFullYear(),z.getMonth()+1,0).getDate(),c=["M","D","W","D","V","Z","Z"].map(x=>`<div class="weekday">${x}</div>`).join("");for(let i=0;i<first;i++)c+="<div></div>";for(let n=1;n<=total;n++){let s=iso(new Date(z.getFullYear(),z.getMonth(),n,12)),due=data.protocols.filter(p=>p.active&&next(p)===s),done=data.logs.filter(l=>l.date===s);c+=`<div class="day ${s===today()?"today":""}"><b>${n}</b>${due.map(()=>'<span class="dot"></span>').join("")}${done.map(()=>'<span class="dot done"></span>').join("")}</div>`}$("#app").innerHTML=`<main class="app"><div class="top"><div><div class="brand">CALENDAR</div><div class="sub">${z.toLocaleDateString("nl-BE",{month:"long",year:"numeric"})}</div></div></div><div class="calendar">${c}</div><div class="hint">Rood = gepland/due · groen = gelogd.</div></main>`}
function stock(){$("#app").innerHTML=`<main class="app"><div class="top"><div><div class="brand">STOCK</div><div class="sub">PERSONAL INVENTORY</div></div><button class="btn primary" onclick="openStock()">+ Add</button></div>${data.stock.map(s=>{let q=Number(s.amount)||0,lo=Number(s.low)||1,p=Math.min(100,Math.max(0,q/Math.max(q,lo)*100));return `<div class="card ${q===0?"emptyStock":q<=lo?"low":""}"><div class="row"><div><div class="name">${esc(s.name)}</div><div class="meta">${esc(s.amount)} ${esc(s.unit)}${s.concentration?" · "+esc(s.concentration):""}</div></div><span class="badge ${q===0?"red":q<=lo?"amber":"green"}">${q===0?"EMPTY":q<=lo?"LOW":"OK"}</span></div><div class="bar"><div class="fill" style="width:${p}%"></div></div><div class="actions"><button class="btn" onclick="adjust('${s.id}',-1)">−</button><button class="btn" onclick="adjust('${s.id}',1)">+</button><button class="btn" onclick="editStock('${s.id}')">Edit</button></div></div>`}).join("")||'<div class="empty">No stock yet.</div>'}</main>`}
function history(){let l=[...data.logs].sort((a,b)=>b.timestamp-a.timestamp);$("#app").innerHTML=`<main class="app"><div class="top"><div><div class="brand">HISTORY</div><div class="sub">COMPLETED LOGS</div></div></div><div class="card">${l.map(x=>`<div class="history"><div><b>${esc(x.name)}</b><div class="meta">${fmt(x.date)}${x.time?" · "+esc(x.time):""}</div></div><span class="badge green">${esc(x.amount)} ${esc(x.unit)}</span></div>`).join("")||'<div class="empty">No history yet.</div>'}</div></main>`}
function openProtocol(p=null){let ints=[1,2,3,4,6,7,14];$("#sheet").innerHTML=`<h2>${p?"Edit protocol":"Add protocol"}</h2><label>NAME</label><input id="pn" value="${esc(p?.name||"")}"><div class="grid2"><div><label>AMOUNT</label><input id="pa" inputmode="decimal" value="${esc(p?.amount||"")}"></div><div><label>UNIT</label><select id="pu">${["mg","IU","mcg","ml","units"].map(u=>`<option ${p?.unit===u?"selected":""}>${u}</option>`).join("")}</select></div></div><label>INTERVAL</label><div class="intervals">${ints.map(n=>`<button id="i${n}" class="${(p?.interval||7)===n?"active":""}" onclick="pick(${n})">${n===1?"Daily":n+" days"}</button>`).join("")}</div><input type="hidden" id="pi" value="${p?.interval||7}"><div class="grid2"><div><label>START</label><input id="ps" type="date" value="${p?.start||today()}"></div><div><label>END (OPTIONAL)</label><input id="pe" type="date" value="${p?.end||""}"></div></div><label>NOTE</label><textarea id="pt">${esc(p?.notes||"")}</textarea><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveP('${p?.id||""}')">Save</button></div>${p?`<div class="actions"><button class="btn" onclick="toggle('${p.id}')">${p.active?"Pause":"Resume"}</button><button class="btn danger" onclick="delP('${p.id}')">Delete</button></div>`:""}<div class="hint">Tracker only: records your own entries and schedule; it does not provide medical dosing recommendations.</div>`;$("#modal").classList.add("show")}
function pick(n){$("#pi").value=n;document.querySelectorAll(".intervals button").forEach(b=>b.classList.remove("active"));$("#i"+n).classList.add("active")}
function saveP(id){let name=$("#pn").value.trim();if(!name)return alert("Vul een naam in.");let old=data.protocols.find(p=>p.id===id),o={id:id||crypto.randomUUID(),name,amount:$("#pa").value,unit:$("#pu").value,interval:Number($("#pi").value),start:$("#ps").value,end:$("#pe").value,notes:$("#pt").value,active:old?old.active:true};if(id)data.protocols[data.protocols.findIndex(p=>p.id===id)]=o;else data.protocols.push(o);save();closeModal();page("protocols")}
function editProtocol(id){openProtocol(data.protocols.find(p=>p.id===id))}function toggle(id){let p=data.protocols.find(x=>x.id===id);p.active=!p.active;save();closeModal();page("protocols")}function delP(id){if(confirm("Protocol verwijderen?")){data.protocols=data.protocols.filter(p=>p.id!==id);save();closeModal();page("protocols")}}
function logDose(id){let p=data.protocols.find(p=>p.id===id);$("#sheet").innerHTML=`<h2>Mark completed</h2><div class="meta">${esc(p.name)} · ${esc(p.amount)} ${esc(p.unit)}</div><label>DATE</label><input id="ld" type="date" value="${today()}"><label>TIME</label><input id="lt" type="time"><label>AMOUNT</label><input id="la" value="${esc(p.amount)}" inputmode="decimal"><label>NOTE</label><textarea id="ln"></textarea><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveL('${id}')">✓ Save</button></div>`;$("#modal").classList.add("show")}
function saveL(id){let p=data.protocols.find(p=>p.id===id);data.logs.push({id:crypto.randomUUID(),protocolId:id,name:p.name,date:$("#ld").value,time:$("#lt").value,amount:$("#la").value,unit:p.unit,note:$("#ln").value,timestamp:Date.now()});save();closeModal();page("dashboard")}
function openStock(s=null){$("#sheet").innerHTML=`<h2>${s?"Edit stock":"Add stock"}</h2><label>PRODUCT</label><input id="sn" value="${esc(s?.name||"")}"><div class="grid2"><div><label>QUANTITY</label><input id="sq" value="${esc(s?.amount||"0")}" inputmode="decimal"></div><div><label>UNIT</label><select id="su">${["vials","units","mg","IU","mcg","ml"].map(u=>`<option ${s?.unit===u?"selected":""}>${u}</option>`).join("")}</select></div></div><label>CONCENTRATION (OPTIONAL)</label><input id="sc" value="${esc(s?.concentration||"")}"><label>LOW STOCK AT</label><input id="sl" value="${esc(s?.low??"1")}" inputmode="decimal"><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveS('${s?.id||""}')">Save</button></div>`;$("#modal").classList.add("show")}
function saveS(id){let o={id:id||crypto.randomUUID(),name:$("#sn").value.trim(),amount:$("#sq").value||"0",unit:$("#su").value,concentration:$("#sc").value.trim(),low:$("#sl").value};if(!o.name)return alert("Vul een product in.");if(id)data.stock[data.stock.findIndex(x=>x.id===id)]=o;else data.stock.push(o);save();closeModal();page("stock")}function editStock(id){openStock(data.stock.find(x=>x.id===id))}function adjust(id,d){let s=data.stock.find(x=>x.id===id);s.amount=String(Math.max(0,(Number(s.amount)||0)+d));save();stock()}function closeModal(){$("#modal").classList.remove("show")}$("#modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
const products=[["Retatrudite 10mg","0","vials","10 mg"],["Retatrudite 20mg","0","vials","20 mg"],["Tirzepatide 10mg","0","vials","10 mg"],["HGH 36 IU","0","vials","36 IU"],["BAC Water 10ml","0","vials","10 ml"],["Testosterone Enanthate","0","vials","250 mg/ml"]];
if(!localStorage.getItem(KEY)){data.stock=products.map(x=>({id:crypto.randomUUID(),name:x[0],amount:x[1],unit:x[2],concentration:x[3],low:"1"}));save()}
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});page("dashboard");
</script><div style="text-align:center;padding:12px 0 90px;color:#666;font:11px system-ui;letter-spacing:.12em">PRIME PROTOCOL V5</div>
</body></html>
