<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<title>Prime Protocol · Klanten</title>

<style>
:root{
  --bg:#070b12;
  --panel:#101a2a;
  --line:#154b66;
  --cyan:#18d7ff;
  --purple:#7567ff;
  --text:#f5f8ff;
  --muted:#8492a6;
  --green:#00d79d;
  --amber:#ffb21c;
  --red:#ff5364;
  --shadow:0 8px 24px rgba(0,0,0,.18)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);scroll-behavior:smooth}
body{
  margin:0;min-height:100dvh;
  background:radial-gradient(circle at 92% -5%,#102b45 0,transparent 34%),var(--bg);
  color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow-x:hidden
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{
  width:min(100%,600px);margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 18px) 12px calc(25px + env(safe-area-inset-bottom))
}
.top{
  border:1px solid #15506a;
  background:linear-gradient(145deg,#111b2d,#0c1422);
  border-radius:16px;padding:15px;
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;box-shadow:var(--shadow)
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{font-size:27px}
.brand h1{
  font-size:18px;line-height:1.1;letter-spacing:1.6px;
  margin:0;color:#2dd5fa
}
.brand small{
  display:block;color:#7f8da2;margin-top:5px;
  letter-spacing:.8px;font-size:10px
}
.btn{
  border:1px solid #1c5a75;background:#0d1b2b;color:#fff;
  border-radius:10px;padding:10px 13px;font-weight:800;
  font-size:12px;white-space:nowrap;min-height:40px
}
.btn.primary{background:linear-gradient(105deg,#09cbed,#7868ff);border:0}
.btn.danger{border-color:#71303a;color:#ff7580}
.btn.ok{border-color:#08795e;color:#00e3a4}
.summary{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;margin-top:12px
}
.stat{
  background:linear-gradient(145deg,#101a2b,#0c1421);
  border:1px solid #15465c;border-radius:13px;padding:13px;
  min-height:85px
}
.stat label{
  display:block;color:#8391a6;font-size:10px;
  font-weight:850;letter-spacing:1px
}
.stat b{display:block;font-size:28px;margin-top:8px;color:var(--cyan)}
.card{
  margin-top:12px;
  background:linear-gradient(145deg,#0f192a,#0b1422);
  border:1px solid #15465c;border-radius:15px;
  padding:13px;box-shadow:var(--shadow)
}
.section-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;margin-bottom:12px
}
.section-head h2{
  margin:0;color:#25d9fa;font-size:15px;letter-spacing:1.2px
}
.search{margin-bottom:10px}
.search input{
  width:100%;background:#0a111c;color:#f4f7fb;
  border:1px solid #234155;border-radius:10px;
  padding:13px;font-size:16px;outline:none
}
.search input:focus,.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--cyan)
}
.notice{color:#8e9bae;font-size:12px;line-height:1.5;margin:7px 0 12px}
.empty{
  padding:24px 12px;text-align:center;color:#7f8ca0;
  border:1px dashed #263544;border-radius:11px;font-size:13px
}
.customer-card{
  padding:13px;border:1px solid #1d4055;border-radius:12px;
  background:#0a111b;margin-top:9px;overflow-wrap:anywhere
}
.customer-card.due{
  border-color:var(--red);
  background:linear-gradient(120deg,#291018,#0a111b)
}
.customer-card.soon{border-color:#9a6a12}
.customer-name{font-size:18px;font-weight:800;overflow-wrap:anywhere}
.customer-info{color:#8e9bae;font-size:12px;line-height:1.55;margin-top:6px}
.customer-top{
  display:flex;justify-content:space-between;
  align-items:flex-start;gap:10px
}
.badge{
  display:inline-block;border:1px solid #1d826c;color:#00dba0;
  border-radius:999px;padding:5px 8px;font-size:10px;
  font-weight:850;white-space:nowrap
}
.badge.due{border-color:var(--red);color:#ff7884;background:#32131a}
.badge.soon{border-color:#a86e00;color:#ffbd2e}
.badge.blue{border-color:#1b6684;color:#72dfff;background:#0a1e2a}
.row{
  display:flex;gap:7px;justify-content:flex-end;
  margin-top:12px;flex-wrap:wrap
}
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.76);
  display:none;align-items:flex-end;justify-content:center;
  padding:10px;z-index:30;overflow:auto
}
.modal.show{display:flex}
.modalbox{
  width:min(560px,100%);max-height:90dvh;overflow:auto;
  background:#0d1624;border:1px solid #1b536b;
  border-radius:17px;padding:16px;margin:auto
}
.modalbox h2{margin:0 0 15px;font-size:19px}
.formgrid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;min-width:0
}
.field{min-width:0}
.field label{
  display:block;color:#8a98aa;font-size:10px;
  font-weight:850;margin-bottom:6px;letter-spacing:.5px
}
.field input,.field select,.field textarea{
  width:100%;min-width:0;display:block;
  background:#0a111c;color:#f4f7fb;
  border:1px solid #234155;border-radius:9px;
  padding:11px;outline:none;font-size:16px
}
.field textarea{min-height:80px;resize:vertical}
.full{grid-column:1/-1}
@media(max-width:380px){
  .app{padding-left:9px;padding-right:9px}
  .brand h1{font-size:15px}
  .brand small{font-size:8px}
  .top{padding:11px}
  .card{padding:10px}
  .formgrid{gap:9px}
  .customer-card{padding:10px}
}
</style>
</head>

<body>
<div class="app">

  <header class="top">
    <div class="brand">
      <span class="logo">⚡</span>
      <div>
        <h1>PRIME PROTOCOL</h1>
        <small>KLANTENBEHEER · LOCAL DATA</small>
      </div>
    </div>
    <button class="btn primary" onclick="openCustomer()">+ Klant</button>
  </header>

  <div class="summary">
    <div class="stat">
      <label>TOTAAL KLANTEN</label>
      <b id="totalCustomers">0</b>
    </div>
    <div class="stat">
      <label>OPVOLGING NODIG</label>
      <b id="dueCustomers">0</b>
    </div>
  </div>

  <section class="card">
    <div class="section-head">
      <h2>👤 KLANTEN</h2>
      <button class="btn" onclick="exportCustomers()">Exporteren</button>
    </div>

    <div class="search">
      <input id="searchInput" type="search"
        placeholder="🔎 Zoek op naam, product of contact..."
        oninput="render()">
    </div>

    <div class="notice">
      Beheer je klanten, bezoekdatums en opvolging.
    </div>

    <div id="customerList"></div>
  </section>

</div>

<div class="modal" id="modal">
  <div class="modalbox" id="modalbox"></div>
</div>

<script>
'use strict';

const KEY = 'primeProtocolMobileV6';

let data = load();

function fresh(){
  return {
    customers:[],
    products:[
      ...['Retatrutide','Tirzepatide'].flatMap(name =>
        [10,20,30,40,50].map(mg => ({
          id:crypto.randomUUID(), name:name, strength:mg+' mg'
        }))
      )
    ],
    protocols:[],
    logs:[],
    settings:{customerInterval:30}
  };
}

function load(){
  try{
    const saved = JSON.parse(localStorage.getItem(KEY));
    if(!saved) return fresh();

    saved.customers = saved.customers || [];
    saved.products = saved.products || [];

    // Voeg ontbrekende varianten toe zonder bestaande producten te verwijderen.
    for(const name of ['Retatrutide','Tirzepatide']){
      for(const mg of [10,20,30,40,50]){
        const strength=mg+' mg';
        const exists=saved.products.some(p =>
          String(p.name||'').trim().toLowerCase()===name.toLowerCase() &&
          String(p.strength||'').trim().toLowerCase()===strength.toLowerCase()
        );
        if(!exists){
          saved.products.push({
            id:crypto.randomUUID(),
            name:name,
            strength:strength
          });
        }
      }
    }

    saved.protocols = saved.protocols || [];
    saved.logs = saved.logs || [];
    saved.settings = Object.assign(
      {customerInterval:30},saved.settings || {}
    );

    return saved;
  }catch(e){
    console.error('Gegevens konden niet worden gelezen:',e);
    return fresh();
  }
}

function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(data));
    render();
  }catch(e){
    alert('Opslaan mislukt. Controleer de beschikbare browseropslag.');
    console.error(e);
  }
}

function esc(value){
  return String(value ?? '').replace(/[&<>"']/g,m=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[m]));
}

function todayISO(){
  const d=new Date();
  d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  return d.toISOString().slice(0,10);
}

function addDays(date,n){
  const d=new Date(date+'T12:00:00');
  d.setDate(d.getDate()+Number(n));
  return d.getFullYear()+'-'+
    String(d.getMonth()+1).padStart(2,'0')+'-'+
    String(d.getDate()).padStart(2,'0');
}

function dayDiff(a,b){
  return Math.round(
    (new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000
  );
}

function formatDate(date){
  if(!date) return 'Niet ingesteld';
  const parts=date.split('-');
  if(parts.length!==3) return date;
  return parts[2]+'-'+parts[1]+'-'+parts[0];
}

function product(id){
  return data.products.find(p=>p.id===id);
}

function customer(id){
  return data.customers.find(c=>c.id===id);
}

function dueLabel(date){
  if(!date) return ['','GEPLAND'];
  const diff=dayDiff(todayISO(),date);
  if(diff<0) return ['due','TE LAAT'];
  if(diff===0) return ['due','VANDAAG'];
  if(diff<=7) return ['soon','BINNEN '+diff+' DAGEN'];
  return ['','GEPLAND'];
}

function openModal(html){
  document.getElementById('modalbox').innerHTML=html;
  document.getElementById('modal').classList.add('show');
}

function closeModal(){
  document.getElementById('modal').classList.remove('show');
}

document.getElementById('modal').addEventListener('click',e=>{
  if(e.target.id==='modal') closeModal();
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeModal();
});

function openCustomer(editId=null){
  const c=editId?customer(editId):null;
  const interval=c?.interval || data.settings.customerInterval || 30;

  const productOptions=data.products.map(p=>
    `<option value="${esc(p.id)}" ${
      c?.productId===p.id?'selected':''
    }>${esc(p.name)}${
      p.strength?' · '+esc(p.strength):''
    }</option>`
  ).join('');

  const productField=data.products.length
    ? `<div class="field">
        <label>PRODUCT</label>
        <select id="cfProduct">
          <option value="">Geen product</option>
          ${productOptions}
        </select>
      </div>`
    : `<input id="cfProduct" type="hidden" value="">
       <div class="field full">
         <label>PRODUCT</label>
         <input id="cfProductName" value="${esc(c?.productName||'')}"
           placeholder="Product of referentie">
       </div>`;

  openModal(`
    <h2>${c?'Klant aanpassen':'Nieuwe klant'}</h2>

    <div class="formgrid">
      <div class="field">
        <label>NAAM *</label>
        <input id="cfName" value="${esc(c?.name||'')}"
          placeholder="Naam" autocomplete="name">
      </div>

      <div class="field">
        <label>CONTACT / REFERENTIE</label>
        <input id="cfContact" value="${esc(c?.contact||'')}"
          placeholder="Optioneel">
      </div>

      <div class="field">
        <label>DATUM BEZOEK</label>
        <input id="cfDate" type="date"
          value="${esc(c?.date||todayISO())}">
      </div>

      <div class="field">
        <label>TERUGKOMEN NA (DAGEN)</label>
        <input id="cfInterval" type="number" min="1"
          value="${esc(interval)}">
      </div>

      ${productField}

      <div class="field full">
        <label>NOTITIE</label>
        <textarea id="cfNote"
          placeholder="Optionele notities">${esc(c?.note||'')}</textarea>
      </div>
    </div>

    <div class="notice">
      De volgende opvolgdatum wordt berekend op basis van de bezoekdatum
      en het ingestelde interval.
    </div>

    <div class="row">
      <button class="btn" onclick="closeModal()">Annuleren</button>
      <button class="btn primary"
        onclick="saveCustomer('${esc(editId||'')}')">Opslaan</button>
    </div>
  `);
}

function saveCustomer(id){
  const name=document.getElementById('cfName').value.trim();

  if(!name){
    alert('Vul een klantnaam in.');
    return;
  }

  const date=document.getElementById('cfDate').value||todayISO();
  const interval=Math.max(
    1,Number(document.getElementById('cfInterval').value||30)
  );

  const productId=document.getElementById('cfProduct').value;
  const selectedProduct=product(productId);

  const productName=selectedProduct
    ? selectedProduct.name
    : (document.getElementById('cfProductName')?.value.trim()||'');

  const old=id?customer(id):null;

  const c={
    id:id||crypto.randomUUID(),
    name:name,
    contact:document.getElementById('cfContact').value.trim(),
    date:date,
    interval:interval,
    productId:productId||old?.productId||'',
    productName:productName,
    note:document.getElementById('cfNote').value.trim(),
    next:addDays(date,interval)
  };

  const index=data.customers.findIndex(x=>x.id===c.id);

  if(index>=0){
    data.customers[index]=c;
  }else{
    data.customers.push(c);
  }

  save();
  closeModal();
}

function markCustomerDone(id){
  const c=customer(id);
  if(!c) return;

  if(!confirm('Opvolging voor '+c.name+' registreren?')) return;

  const visitDate=c.next||todayISO();
  c.date=visitDate;
  c.next=addDays(visitDate,Math.max(1,Number(c.interval||30)));

  data.logs.unshift({
    id:crypto.randomUUID(),
    type:'followup',
    customerId:id,
    date:new Date().toISOString(),
    text:c.name+' · opvolging geregistreerd'
  });

  save();
}

function deleteCustomer(id){
  const c=customer(id);
  if(!c) return;

  if(!confirm('Klant '+c.name+' definitief verwijderen?')) return;

  data.customers=data.customers.filter(x=>x.id!==id);
  save();
}

function customerHTML(c){
  const p=product(c.productId);
  const [cls,label]=dueLabel(c.next);

  const productName=p
    ? p.name+(p.strength?' · '+p.strength:'')
    : (c.productName||'Geen product');

  const diff=c.next?dayDiff(todayISO(),c.next):null;

  return `
    <article class="customer-card ${
      cls==='due'?'due':cls==='soon'?'soon':''
    }">
      <div class="customer-top">
        <div style="min-width:0;flex:1">
          <div class="customer-name">${esc(c.name)}</div>

          ${c.contact?`
            <div class="customer-info">Contact: ${esc(c.contact)}</div>
          `:''}

          <div class="customer-info">
            ${esc(productName)}
            <br>Bezoek: ${esc(formatDate(c.date))}
            <br>Volgende: ${esc(formatDate(c.next))}
          </div>

          ${c.note?`
            <div class="customer-info">📝 ${esc(c.note)}</div>
          `:''}
        </div>

        <span class="badge ${cls}">${esc(label)}</span>
      </div>

      <div class="row">
        <button class="btn" onclick="openCustomer('${esc(c.id)}')">
          Aanpassen
        </button>

        ${diff!==null&&diff<=0?`
          <button class="btn ok"
            onclick="markCustomerDone('${esc(c.id)}')">
            ✓ Opgevolgd
          </button>
        `:''}

        <button class="btn danger" onclick="deleteCustomer('${esc(c.id)}')">
          Wis
        </button>
      </div>
    </article>
  `;
}

function render(){
  const query=(document.getElementById('searchInput')?.value||'')
    .trim().toLocaleLowerCase('nl-BE');

  const due=data.customers.filter(c=>
    c.next&&dayDiff(todayISO(),c.next)<=0
  );

  document.getElementById('totalCustomers').textContent=
    data.customers.length;

  document.getElementById('dueCustomers').textContent=due.length;

  const filtered=data.customers.filter(c=>{
    const p=product(c.productId);
    const text=[
      c.name,c.contact,c.note,c.productName,p?.name
    ].join(' ').toLocaleLowerCase('nl-BE');

    return text.includes(query);
  }).sort((a,b)=>
    (a.next||'9999-12-31').localeCompare(b.next||'9999-12-31')
  );

  document.getElementById('customerList').innerHTML=filtered.length
    ?filtered.map(customerHTML).join('')
    :`<div class="empty">${
      query
        ?'Geen klanten gevonden voor deze zoekopdracht.'
        :'Nog geen klanten. Voeg je eerste klant toe.'
    }</div>`;
}

function exportCustomers(){
  const content=JSON.stringify({
    exportedAt:new Date().toISOString(),
    customers:data.customers
  },null,2);

  const blob=new Blob([content],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');

  a.href=url;
  a.download='prime-protocol-klanten-backup.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

render();
</script>
</body>
</html>
