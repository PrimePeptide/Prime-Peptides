<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070708">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<title>Prime Protocol</title>
<style>
:root{--bg:#070708;--card:#111113;--card2:#151518;--line:#2a2a2e;--text:#f4f4f5;--muted:#929299;--accent:#e9e9eb;--danger:#ff6262}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{min-height:100vh}button,input,select,textarea{font:inherit}button{color:var(--text)}
.app{max-width:760px;margin:auto;padding:22px 18px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 24px}
.brand{letter-spacing:4px;font-weight:800;font-size:19px}.sub{color:var(--muted);letter-spacing:2px;font-size:12px;margin-top:7px}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:16px;padding:13px 18px;font-weight:700;cursor:pointer}.btn.primary{background:#f0f0f2;color:#09090a}.btn.danger{color:var(--danger)}
.hero{background:linear-gradient(145deg,#151517,#0d0d0f);border:1px solid #303035;border-radius:28px;padding:27px 24px;margin-bottom:14px}
.eyebrow{font-size:12px;letter-spacing:3px;color:#a5a5ac}.hero h1{font-size:34px;margin:10px 0 8px}.hero p{color:var(--muted);margin:0;line-height:1.5}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px}.stat{border:1px solid var(--line);background:var(--card);border-radius:22px;padding:20px}.stat small{color:var(--muted);letter-spacing:2px}.stat b{display:block;font-size:31px;margin-top:8px}
h2{font-size:21px;margin:26px 0 13px}.empty{border:1px dashed #2b2b30;border-radius:22px;padding:28px;text-align:center;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:10px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.name{font-size:19px;font-weight:750}.meta{color:var(--muted);font-size:13px;margin-top:7px}.pill{border:1px solid var(--line);padding:6px 9px;border-radius:999px;color:#bdbdc4;font-size:12px}
.actions{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}.actions .btn{padding:10px 13px}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(8,8,9,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}
.navin{width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);padding:9px 10px calc(9px + env(safe-area-inset-bottom));gap:4px}.navbtn{border:0;background:transparent;color:var(--muted);padding:10px 4px;border-radius:16px}.navbtn.active{background:#1a1a1d;color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;z-index:10}.modal.show{display:flex}.sheet{width:100%;max-width:760px;margin:auto auto 0;background:#111113;border:1px solid var(--line);border-radius:28px 28px 0 0;padding:22px 18px calc(25px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}.sheet h2{margin:0 0 18px}
label{display:block;color:#b5b5bc;font-size:12px;letter-spacing:1.3px;margin:15px 0 7px}input,select,textarea{width:100%;background:#08080a;border:1px solid #33333a;color:#fff;border-radius:14px;padding:13px}textarea{min-height:85px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-actions{display:flex;gap:10px;margin-top:20px}.modal-actions>*{flex:1}
.note{font-size:11px;color:#77777e;line-height:1.45;margin-top:12px}
.history-item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:15px 0;border-bottom:1px solid #252529}.history-item:last-child{border-bottom:0}
.settings-line{padding:17px 0;border-bottom:1px solid var(--line)}.settings-line b{display:block}.settings-line span{color:var(--muted);font-size:13px}
@media(min-width:700px){.app{padding-top:35px}.modal{align-items:center}.sheet{border-radius:28px;max-width:620px}}
</style>
</head>
<body>
<div id="app"></div>
<nav><div class="navin" id="nav"></div></nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const KEY="prime_protocol_data_v2";
let data=JSON.parse(localStorage.getItem(KEY)||'{"protocols":[],"logs":[],"stock":[],"settings":{"confirm":true}}'); data.stock=data.stock||[];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const today=()=>{let d=new Date();return d.toISOString().slice(0,10)};
const fmt=d=>new Date(d+"T12:00:00").toLocaleDateString(undefined,{day:"2-digit",month:"short",year:"numeric"});
function nextDate(p){
  if(!p.start)return null;
  let d=new Date(p.start+"T12:00:00"), t=new Date(); t.setHours(12,0,0,0);
  const days=Math.max(1,Number(p.interval)||1);
  while(d<t)d.setDate(d.getDate()+days);
  if(p.end && d>new Date(p.end+"T12:00:00"))return null;
  return d.toISOString().slice(0,10);
}
function renderNav(active){
 const items=[["dashboard","Dashboard"],["protocols","Protocols"],["calendar","Calendar"],["stock","Stock"],["history","History"],["settings","Settings"]];
 $("#nav").innerHTML=items.map(([id,label])=>`<button class="navbtn ${active===id?"active":""}" onclick="page('${id}')">${label}</button>`).join("");
}
function page(which="dashboard"){
 if(which==="dashboard")dashboard();
 if(which==="protocols")protocols();
 if(which==="history")history();
 if(which==="calendar")calendar();
 if(which==="stock")stock();
 if(which==="settings")settings();
 renderNav(which);
 window.scrollTo(0,0);
}
function dashboard(){
 const active=data.protocols.filter(p=>p.active);
 const logsToday=data.logs.filter(x=>x.date===today()).length;
 $("#app").innerHTML=`<main class="app">
 <div class="top"><div><div class="brand">PRIME PROTOCOL</div><div class="sub">PRIVATE INJECTION TRACKER</div></div><button class="btn" onclick="openAdd()">+ Add</button></div>
 <section class="hero"><div class="eyebrow">PRIME PROTOCOL</div><h1>Today's protocol</h1><p>Log what you actually took. This tracker does not recommend doses.</p></section>
 <div class="stats"><div class="stat"><small>ACTIVE</small><b>${active.length}</b></div><div class="stat"><small>LOGGED TODAY</small><b>${logsToday}</b></div></div>
 <h2>Today</h2>${todayCards(active)}
 <h2>All active</h2>${active.length?active.map(protocolCard).join(""):`<div class="empty">Add your first protocol.</div>`}
 </main>`;
}
function todayCards(active){
 let due=active.filter(p=>nextDate(p)===today());
 return due.length?due.map(p=>protocolCard(p,true)).join(""):`<div class="empty">Nothing scheduled today.</div>`;
}
function protocolCard(p,due=false){
 const n=nextDate(p);
 const last=[...data.logs].reverse().find(x=>x.protocolId===p.id);
 return `<div class="card"><div class="row"><div><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.amount)} ${esc(p.unit)} · every ${p.interval} day${p.interval==1?"":"s"}</div></div>${due?'<span class="pill">DUE</span>':''}</div>
 <div class="meta">Next: ${n?fmt(n):"—"}${last?` · Last logged: ${fmt(last.date)}`:""}</div>
 <div class="actions"><button class="btn primary" onclick="logDose('${p.id}')">Log dose</button><button class="btn" onclick="editProtocol('${p.id}')">Edit</button></div></div>`;
}
function protocols(){
 $("#app").innerHTML=`<main class="app"><div class="top"><div><div class="brand">PROTOCOLS</div><div class="sub">YOUR ACTIVE & PAUSED PROTOCOLS</div></div><button class="btn" onclick="openAdd()">+ Add</button></div>
 ${data.protocols.length?data.protocols.map(p=>protocolCard(p)).join(""):`<div class="empty">No protocols yet.</div>`}</main>`;
}
function history(){
 const logs=[...data.logs].sort((a,b)=>b.timestamp-a.timestamp);
 $("#app").innerHTML=`<main class="app"><div class="top"><div><div class="brand">HISTORY</div><div class="sub">WHAT YOU ACTUALLY LOGGED</div></div></div>
 ${logs.length?`<div class="card">${logs.map(x=>`<div class="history-item"><div><b>${esc(x.name)}</b><div class="meta">${fmt(x.date)}${x.time?" · "+esc(x.time):""}${x.note?" · "+esc(x.note):""}</div></div><div><span class="pill">${esc(x.amount)} ${esc(x.unit)}</span><button class="btn danger" style="margin-left:6px;padding:6px 9px" onclick="deleteLog('${x.id}')">×</button></div></div>`).join("")}</div>`:`<div class="empty">No doses logged yet.</div>`}</main>`;
}

function calendar(){
 const active=data.protocols.filter(p=>p.active), start=new Date();
 start.setHours(12,0,0,0);
 let days=[];
 for(let i=0;i<14;i++){
   let d=new Date(start); d.setDate(start.getDate()+i);
   let s=d.toISOString().slice(0,10);
   let due=active.filter(p=>nextDate(p)===s);
   let logged=data.logs.filter(x=>x.date===s);
   days.push(`<div class="card"><div class="row"><div><b>${fmt(s)}</b><div class="meta">${i===0?"Today":""}</div></div><span class="pill">${due.length} due · ${logged.length} logged</span></div>${due.map(p=>`<div class="meta" style="margin-top:12px">• ${esc(p.name)} — ${esc(p.amount)} ${esc(p.unit)}</div>`).join("")}</div>`);
 }
 $("#app").innerHTML=`<main class="app"><div class="top"><div><div class="brand">CALENDAR</div><div class="sub">NEXT 14 DAYS</div></div></div>${days.join("")}</main>`;
}
function stock(){
 const items=data.stock||[];
 $("#app").innerHTML=`<main class="app"><div class="top"><div><div class="brand">STOCK</div><div class="sub">PERSONAL INVENTORY</div></div><button class="btn" onclick="openStock()">+ Add</button></div>
 ${items.length?items.map(s=>`<div class="card"><div class="row"><div><div class="name">${esc(s.name)}</div><div class="meta">${esc(s.amount)} ${esc(s.unit)}${s.concentration?" · "+esc(s.concentration):""}${s.expiry?" · Exp "+fmt(s.expiry):""}</div></div><span class="pill">${Number(s.amount)===0?"EMPTY":"IN STOCK"}</span></div>
 <div class="actions"><button class="btn" onclick="adjustStock('${s.id}',-1)">−</button><button class="btn" onclick="adjustStock('${s.id}',1)">+</button><button class="btn" onclick="editStock('${s.id}')">Edit</button></div></div>`).join(""):`<div class="empty">No stock added yet.</div>`}
 <div class="note">Personal inventory only. Stock quantities are manually controlled; no purchasing, sales, or dosing recommendations.</div></main>`;
}
function openStock(s=null){
 $("#sheet").innerHTML=`<h2>${s?"Edit stock":"Add stock item"}</h2>
 <label>PRODUCT</label><input id="s_name" value="${esc(s?.name||"")}">
 <div class="grid2"><div><label>QUANTITY</label><input id="s_amount" inputmode="decimal" value="${esc(s?.amount||"")}"></div><div><label>UNIT</label><select id="s_unit">${["vials","units","mg","IU","mcg","ml","custom"].map(u=>`<option ${s?.unit===u?"selected":""}>${u}</option>`).join("")}</select></div></div>
 <label>CONCENTRATION (OPTIONAL)</label><input id="s_concentration" value="${esc(s?.concentration||"")}"><label>EXPIRY (OPTIONAL)</label><input id="s_expiry" type="date" value="${s?.expiry||""}">
 <label>NOTE (OPTIONAL)</label><textarea id="s_note">${esc(s?.note||"")}</textarea>
 <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveStock('${s?.id||""}')">Save</button></div>
 ${s?`<div class="actions"><button class="btn danger" onclick="deleteStock('${s.id}')">Delete</button></div>`:""}`;
 $("#modal").classList.add("show");
}
function saveStock(id){
 const name=$("#s_name").value.trim(); if(!name){alert("Enter a product name.");return}
 const obj={id:id||crypto.randomUUID(),name,amount:$("#s_amount").value.trim()||"0",unit:$("#s_unit").value,concentration:$("#s_concentration").value.trim(),expiry:$("#s_expiry").value,note:$("#s_note").value.trim()};
 if(id){const i=data.stock.findIndex(s=>s.id===id);data.stock[i]=obj}else data.stock.push(obj);
 save();closeModal();page("stock");
}
function editStock(id){openStock(data.stock.find(s=>s.id===id))}
function adjustStock(id,delta){
 const s=data.stock.find(s=>s.id===id); if(!s)return;
 let n=Number(s.amount); if(Number.isNaN(n))return;
 s.amount=String(Math.max(0,n+delta)); save(); stock();
}
function deleteStock(id){
 if(confirm("Delete this stock item?")){data.stock=data.stock.filter(s=>s.id!==id);save();closeModal();page("stock")}
}

function settings(){
 $("#app").innerHTML=`<main class="app"><div class="top"><div><div class="brand">SETTINGS</div><div class="sub">PRIVATE · LOCAL STORAGE</div></div></div>
 <div class="card">
 <div class="settings-line"><b>Storage</b><span>Your protocol and history data stays in this browser on this device.</span></div>
 <div class="settings-line"><b>Data</b><span>Export a backup or clear all local data.</span></div>
 <div class="actions"><button class="btn" onclick="exportData()">Export backup</button><button class="btn danger" onclick="clearData()">Clear all data</button></div>
 <div class="note">This app is a personal logging tool. It does not calculate, prescribe, or recommend doses.</div></div></main>`;
}
function openAdd(p=null){
 $("#sheet").innerHTML=`<h2>${p?"Edit protocol":"Add protocol"}</h2>
 <label>NAME</label><input id="f_name" value="${esc(p?.name||"")}">
 <div class="grid2"><div><label>AMOUNT</label><input id="f_amount" inputmode="decimal" value="${esc(p?.amount||"")}"></div><div><label>UNIT</label><select id="f_unit">${["mg","IU","mcg","ml","units","custom"].map(u=>`<option ${p?.unit===u?"selected":""}>${u}</option>`).join("")}</select></div></div>
 <div class="grid2"><div><label>EVERY X DAYS</label><input id="f_interval" type="number" min="1" step="1" value="${p?.interval||7}"></div><div><label>START DATE</label><input id="f_start" type="date" value="${p?.start||today()}"></div></div>
 <label>END DATE (OPTIONAL)</label><input id="f_end" type="date" value="${p?.end||""}">
 <label>NOTES (OPTIONAL)</label><textarea id="f_notes">${esc(p?.notes||"")}</textarea>
 <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveProtocol('${p?.id||""}')">Save</button></div>
 ${p?`<div class="actions"><button class="btn danger" onclick="deleteProtocol('${p.id}')">Delete protocol</button><button class="btn" onclick="toggleProtocol('${p.id}')">${p.active?"Pause":"Resume"}</button></div>`:""}
 <div class="note">Enter only the schedule and amount you personally want to track. No dose recommendations are generated.</div>`;
 $("#modal").classList.add("show");
}
function saveProtocol(id){
 const name=$("#f_name").value.trim(); if(!name){alert("Enter a protocol name.");return}
 const obj={id:id||crypto.randomUUID(),name,amount:$("#f_amount").value.trim(),unit:$("#f_unit").value,interval:Math.max(1,Number($("#f_interval").value)||1),start:$("#f_start").value,end:$("#f_end").value,notes:$("#f_notes").value.trim(),active:true};
 if(id){const i=data.protocols.findIndex(p=>p.id===id);obj.active=data.protocols[i]?.active??true;data.protocols[i]=obj}else data.protocols.push(obj);
 save();closeModal();page("protocols");
}
function editProtocol(id){openAdd(data.protocols.find(p=>p.id===id))}
function toggleProtocol(id){const p=data.protocols.find(p=>p.id===id);if(p){p.active=!p.active;save();closeModal();page("protocols")}}
function deleteProtocol(id){if(confirm("Delete this protocol? Existing history stays.")){data.protocols=data.protocols.filter(p=>p.id!==id);save();closeModal();page("protocols")}}
function logDose(id){
 const p=data.protocols.find(p=>p.id===id); if(!p)return;
 $("#sheet").innerHTML=`<h2>Log dose · ${esc(p.name)}</h2><label>DATE</label><input id="l_date" type="date" value="${today()}"><label>TIME (OPTIONAL)</label><input id="l_time" type="time"><label>AMOUNT</label><input id="l_amount" inputmode="decimal" value="${esc(p.amount)}"><label>UNIT</label><input id="l_unit" value="${esc(p.unit)}"><label>NOTE (OPTIONAL)</label><textarea id="l_note"></textarea><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveLog('${id}')">Log it</button></div>`;
 $("#modal").classList.add("show");
}
function saveLog(id){
 const p=data.protocols.find(p=>p.id===id);
 data.logs.push({id:crypto.randomUUID(),protocolId:id,name:p.name,date:$("#l_date").value,time:$("#l_time").value,amount:$("#l_amount").value.trim(),unit:$("#l_unit").value.trim(),note:$("#l_note").value.trim(),timestamp:Date.now()});
 save();closeModal();page("history");
}
function deleteLog(id){data.logs=data.logs.filter(x=>x.id!==id);save();history()}
function closeModal(){$("#modal").classList.remove("show")}
function exportData(){
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="prime-protocol-backup.json";a.click();URL.revokeObjectURL(a.href);
}
function clearData(){if(confirm("This clears all protocols and history from this device. Continue?")){localStorage.removeItem(KEY);location.reload()}}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});

if(data.stock.length===0){
 data.stock=[
  {id:crypto.randomUUID(),name:"Retatrudite 10mg",amount:"0",unit:"vials",expiry:"",note:""},
  {id:crypto.randomUUID(),name:"Retatrudite 20mg",amount:"0",unit:"vials",expiry:"",note:""},
  {id:crypto.randomUUID(),name:"Tirzepatide 10mg",amount:"0",unit:"vials",expiry:"",note:""},
  {id:crypto.randomUUID(),name:"HGH 36 IU",amount:"0",unit:"vials",expiry:"",note:""},
  {id:crypto.randomUUID(),name:"BAC Water 10ml",amount:"0",unit:"vials",expiry:"",note:""},
  {id:crypto.randomUUID(),name:"Testosterone Enanthate",amount:"0",unit:"vials",concentration:"250 mg/ml",expiry:"",note:""}
 ];
 save();
}

page("dashboard");
</script>
</body></html>
